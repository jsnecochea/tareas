/* ---- FILTRO LOCAL: cuesta CERO tokens y resuelve la mayoría ----
   Antes de preguntarle nada a Claude, se busca a mano si lo dictado comparte
   algo con lo que ya está abierto. Si no comparte nada, es nueva y ya:
   NO SE LLAMA A CLAUDE. Y cuando sí, solo se mandan las candidatas, no la
   lista completa: el costo crece con lo que se parece, no con lo que hay. */
var VACIAS=("de la el los las un una unos unas y o que en por para con del al se su sus "+
 "le les lo me mi te tu es son esta este esa ese hay ya no si mas más muy tambien también "+
 "dile dile diles favor porfa oye mira quiero necesito hay que hacer haga hagan poner pon "+
 "ponle ponme mande manda mandar revisa revisar checa checar ver vi "+
 "todos todas cada dias diario diaria semana semanal mensual manana ayer tarde noche siempre "+
 "hasta desde entre lunes martes miercoles jueves viernes sabado domingo hora horas minuto minutos "+
 "recuerda recuerdame recuerdanos recordar recordatorio acuerda acuerdate acuerdame cita").split(" ");
function palabras(txt){
  return String(txt||"").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9n ]/g," ").split(/\s+/)
    .filter(function(w){ return w.length>3 && VACIAS.indexOf(w)<0 });
}
/* raíz: pipa y pipas tienen que ser la misma palabra, y aspersor y aspersores */
function raiz(w){ return w.length>4 ? w.slice(0,4) : w }

/* FAMILIAS: lo que la gente dice distinto y es lo mismo. Si dictan "regar",
   tiene que encontrar la tarea de "pipas de riego". Sin esto el filtro local
   deja pasar duplicados, que es peor que llamar a Claude de más. */
var FAMILIAS=[
  ["pipa","pipas","riego","riegos","regar","riega","riegan","rieguen","regando","agua","regadera","cisterna"],
  ["alumbrado","luz","foco","focos","lampara","lamparas","luminaria","electrico","electricidad","apagado","fundido"],
  ["poda","podar","seto","setos","jardin","jardines","jardinero","jardineros","pasto","cesped"],
  ["bomba","motobomba","presion"],
  ["aspersor","aspersores","rociador"],
  ["palma","palmas","arbol","arboles","agronomo","planta","plantas"],
  ["fuente","fuentes"],
  ["basura","botes","limpieza","recoleccion"],
  /* OJO: nada de palabras genéricas aquí. "acceso" se quitó porque "acceso
     principal" es un lugar cualquiera; y "seguridad" porque chocaba con el
     "seguro" del camión, que no tiene nada que ver. */
  ["caseta","vigilancia","guardia","porton","velador"],
  ["pago","pagar","factura","ticket","comprobante","cobranza","recibo"]
];
function familia(w){
  for(var i=0;i<FAMILIAS.length;i++)
    for(var j=0;j<FAMILIAS[i].length;j++)
      if(raiz(FAMILIAS[i][j])===raiz(w)) return i;
  return -1;
}
function candidatas(texto, quien, incCerradas){
  var pw=palabras(texto); if(!pw.length) return [];
  var pr=pw.map(raiz), pf=pw.map(familia).filter(function(x){return x>=0});
  var out=[];
  tareas.forEach(function(t){
    /* Por default NO se ven las cerradas. Con incCerradas si, porque para
       REVISAR algo lo normal es que el otro ya lo haya entregado y cerrado
       (Salvador 2026-09-04). */
    if(t.cierre && !incCerradas) return;
    if(quien && t.duenio!==quien) return;
    var tw=palabras([t.nombre,t.revisar,t.cierra].join(" "));
    var tr=tw.map(raiz), tf=tw.map(familia).filter(function(x){return x>=0});
    var n=0;
    pr.forEach(function(r){ if(tr.indexOf(r)>=0) n+=2 });          // misma palabra
    pf.forEach(function(f){ if(tf.indexOf(f)>=0) n+=1 });          // misma familia
    /* antes bastaba UNA palabra en comun (n>0) y salian hasta 6: cualquier
       palabra suelta ("ver", "el proximo") volvia candidata a media lista. Ahora
       se exige al menos una palabra fuerte compartida (n>=2), o una sola familia
       cuando el dictado fue muy corto. Asi la duda queda entre pocas, no una
       lista gigante. Salvador 2026-09-17. */
    var minimo = (pw.length<=2) ? 1 : 2;
    if(n>=minimo) out.push({t:t,score:n});
  });
  return out.sort(function(a,b){return b.score-a.score}).slice(0,4).map(function(x){return x.t});
}

/* memoria corta: el mismo dictado no se juzga dos veces en 10 minutos */
var CACHE_DUP={};
function claveCache(txt,quien){ return (quien||"")+"|"+String(txt).toLowerCase().replace(/\s+/g," ").trim() }

/* ---- ¿ESTO YA LO TENGO? — el filtro que evita la bandeja llena de repetidas ----
   Antes de crear cualquier tarea, se compara contra las que ya están abiertas.
   NO se compara por texto igual: se compara por DE QUÉ SE TRATA.
   Cuatro salidas, y una de ellas es no decidir solo. */
function buscaDuplicado(texto, quien, cb){
  /* 1. caché: mismo dictado en los últimos 10 minutos */
  var ck=claveCache(texto,quien), hit=CACHE_DUP[ck];
  if(hit && Date.now()-hit.ts<600000){ cb(hit.v); return }

  /* 2. filtro local, cero tokens */
  var cand=candidatas(texto,quien);
  if(!cand.length){ var v0={veredicto:"NUEVA",local:true};
    CACHE_DUP[ck]={ts:Date.now(),v:v0}; cb(v0); return }

  /* 3. solo las candidatas, y con los campos cortos */
  var abiertas=cand.map(function(t){
    return {id:t.id, nombre:t.nombre, cada:t.periodicidad||"unica",
            estado:estadoReal(t), de:t.revisar||""};
  });

  var sys="Eres el filtro de tareas repetidas de una empresa pequeña. "+
    "Te doy las tareas ABIERTAS de una persona y una tarea que alguien acaba de dictar. "+
    "Decide en cuál de cinco casos cae.\n"+
    "LOS CINCO:\n"+
    "  MISMA      es la misma tarea que ya existe. No se crea nada.\n"+
    "  ENRIQUECE  es la misma, pero trae MÁS DETALLE: días, lugares, criterios. Se le agrega a la que existe.\n"+
    "  VECINA     es distinta, PERO toca el mismo asunto o el mismo lugar que una que ya existe:\n"+
    "             misma cosa con otra frecuencia, otro día, otro alcance u otro proveedor.\n"+
    "             ES EL CASO MÁS IMPORTANTE: quien dicta puede no acordarse de que ya hay algo parecido.\n"+
    "             Ejemplo: ya hay 'pipas martes y jueves' y dictan 'contrata una pipa los sábados'.\n"+
    "  NUEVA      no se parece a nada abierto.\n"+
    "  DUDA       no estás razonablemente seguro.\n"+
    "REGLAS:\n"+
    "- Una vuelta más de una tarea recurrente NO es una tarea nueva. 'Las pipas del jueves' es la recurrente de pipas.\n"+
    "- Ante VECINA o DUDA nunca decidas solo: hay que preguntar. Equivocarse callado es peor que preguntar.\n"+
    "- Compartir TEMA general (jardin, agua, dinero, mantenimiento) NO hace VECINA: VECINA exige el MISMO objeto o el MISMO servicio. Pagar al jardinero y hacer la poda NO son vecinas.\n"+
    "- NUEVA solo cuando de verdad no toca nada de lo que ya está abierto.\n"+
    "Contesta SOLO un JSON: {\"veredicto\":\"MISMA|ENRIQUECE|VECINA|NUEVA|DUDA\",\"id\":\"<id o null>\","+
    "\"que_agrega\":\"<si es ENRIQUECE o VECINA, qué trae de nuevo>\",\"por_que\":\"<una línea>\"}";

  var msj=[{role:"user",content:
    "TAREAS ABIERTAS:\n"+JSON.stringify(abiertas,null,1)+
    "\n\nLO QUE SE ACABA DE DICTAR:\n"+texto}];

  preguntaAClaude([{role:"user",content:sys+"\n\n"+msj[0].content}],"rapido",function(txt,err){
    /* SI EL FILTRO NO PUDO CORRER, LA TAREA SE CREA IGUAL. Antes contestaba
       DUDA y eso BLOQUEABA el alta con un "se parece a algo que ya tienes" que
       ademas era mentira: no se parecia a nada, es que no hubo internet o el
       proxy no contesto. Perder el dictado por una falla tecnica es peor que
       arriesgarse a una repetida, y la falla se DICE en el chat de la tarea.
       Salvador 2026-09-05. */
    if(err){ cb({veredicto:"NUEVA", fallo:true, error:err}); return }
    try{
      var m=txt.match(/\{[\s\S]*\}/);
      var v=m?JSON.parse(m[0]):{veredicto:"DUDA"};
      CACHE_DUP[ck]={ts:Date.now(),v:v};
      cb(v);
    }catch(e){ cb({veredicto:"DUDA"}); }
  });
}

/* qué se le contesta a quien dictó, según el veredicto */
function respuestaDuplicado(v){
  var t=v.id?tareas.filter(function(x){return x.id===v.id})[0]:null;
  if(v.veredicto==="MISMA" && t)
    return {crear:false, texto:"Esa ya existe: “"+t.nombre+"”, de "+PERSONAS[t.duenio].nombre+". "+
      "Va "+estadoReal(t)+(t.ultima?" — "+t.ultima:"")+". No abrí otra."};
  if(v.veredicto==="ENRIQUECE" && t)
    return {crear:false, enriquece:t, texto:"No es nueva: es la misma de “"+t.nombre+"”, con más detalle. "+
      "Le agrego: "+(v.que_agrega||"el detalle que dictaste")+". ¿Lo dejo así?"};
  if(v.veredicto==="VECINA" && t)
    return {crear:null, vecina:t, texto:
      "Ojo: ya tienes “"+t.nombre+"”"+(t.periodicidad?" ("+t.periodicidad+")":"")+", de "+
      PERSONAS[t.duenio].nombre+", y esto toca lo mismo. Antes de abrir otra, dime:",
      ops:[
        {k:"sumar", t:"Súmalo a la que ya existe", d:"Queda una sola tarea con todo. Es lo normal cuando es la misma cosa con otro día o alcance."},
        {k:"aparte",t:"Ábrela aparte",             d:"Solo si de verdad es otro contrato, otro proveedor o se cierra por su lado."},
        {k:"nada",  t:"Con la que ya tengo basta", d:"No se abre nada. Se descarta lo que acabas de dictar."}
      ]};
  /* DUDA solo detiene si se puede ENSEÑAR contra cual choca. Sin eso, el aviso
     era "se parece a algo" sin poder decir a que — imposible de contestar y
     contra la regla de que todo se pueda rastrear. Salvador 2026-09-05. */
  if(v.veredicto==="DUDA" && t)
    return {crear:null, texto:"Se parece a algo que ya tienes: “"+t.nombre+"”"+
      ". ¿Es la misma o de verdad es otra? No la abro hasta que me digas."};
  if(v.fallo)
    return {crear:true, aviso:"No alcancé a revisar si ya tenías una parecida — "+
      "no hubo conexión. La abrí de todos modos: si ya la tenías, ciérrala."};
  return {crear:true, texto:"No se parece a ninguna abierta. La doy de alta."};
}


/* ================= EL CEREBRO: DAÑO Y RITMO =================
   Dictado por Salvador el 2026-09-02, y es la pieza que hace que esto no sea
   una lista de tareas más.

   LO QUE DISPARA LA ESCALADA NO ES LA FECHA. ES EL DAÑO.
   Una tarea vencida no vale lo mismo que otra vencida. Tratarlas igual es lo
   que inunda al jefe: con 15% de retrasos y diez empleados, sin filtro llueve.

   TRES FORMAS DE DAÑO. Las pone Claude al dar de alta la tarea; el empleado
   nunca las ve ni las elige.
     plano       molesta igual todos los días y nunca se vuelve urgente.
                 La luz apagada, un aspersor tapado.
                 NUNCA ESCALA SOLA. Se persigue y entra al resumen.
     escalonado  brinca en cada vuelta perdida. Pipas, rondín, contabilidad.
                 Un martes sin riego no es nada; el jueves ya es plata.
                 ESCALA EN LA SEGUNDA VUELTA PERDIDA.
     acantilado  cero daño hasta la fecha, y al día siguiente catástrofe.
                 Un pago que vence, un permiso, un vuelo.
                 ESCALA ANTES DE VENCERSE, no después.
*/

var DANIO={
  plano:      {escala:false, avisa_antes:0,  toques_antes_de_subir:99},
  escalonado: {escala:true,  avisa_antes:0,  toques_antes_de_subir:2},
  acantilado: {escala:true,  avisa_antes:2,  toques_antes_de_subir:1}
};
function formaDanio(t){ return DANIO[t.danio] ? t.danio : "plano" }

/* cuánto daño lleva acumulado, en "vueltas perdidas" o en días */
function danioAcumulado(t){
  var f=formaDanio(t);
  if(t.cierre) return 0;
  var d=t.f_vigente ? dDif(t.f_vigente,hoy()) : 0;
  if(f==="acantilado") return d>0 ? 99 : 0;              // pasó la fecha: catástrofe
  if(f==="escalonado"){
    var largo = t.periodicidad==="semanal" ? 7 : (t.periodicidad==="mensual" ? 30 : 1);
    return d>0 ? Math.ceil(d/largo) : 0;                  // vueltas perdidas
  }
  return d>0 ? d : 0;                                     // plano: días de molestia
}

/* ---- EL RITMO: ver que va a fallar ANTES de que falle ----
   Si trae pasos y el que tocaba ya se pasó, la tarea todavía no está vencida
   pero ya va a fallar. Ése es el momento de apretar.
   AVISAR ANTES VALE MÁS QUE REPORTAR DESPUÉS. */
function ritmo(t){
  if(t.cierre || !t.pasos || !t.pasos.length || !t.f_original) return null;
  var i=t.paso||0;
  var paso=t.pasos[i]; if(!paso) return null;
  var nace=t.pasos[0] && t.pasos[0].dia!=null ? t.pasos[0].dia : 0;
  var inicio=dmDe(t.f_original, -(t.pasos[t.pasos.length-1].dia||0));
  var debio=dmDe(inicio, paso.dia||0);
  var atraso=dDif(debio,hoy());
  if(atraso<=0) return null;
  var quedan=dDif(hoy(), t.f_vigente||t.f_original);
  var faltan=t.pasos.length-i;
  return {
    paso:paso.t, atraso:atraso, quedan:quedan, faltan:faltan,
    /* va a fallar si lo que falta ya no cabe en lo que queda */
    va_a_fallar: quedan < (t.pasos[t.pasos.length-1].dia||0) - (paso.dia||0)
  };
}

/* ---- ¿ESTO LE TOCA AL JEFE, O TODAVÍA ME TOCA A MÍ? ----
   Yo absorbo el perseguir. Solo lo que sobrevive a mis toques sube.
   Devuelve null cuando NO debe subir. */
function subeAlJefe(t){
  if(t.cierre) return null;
  var f=formaDanio(t), cfg=DANIO[f];
  var toques=(t.empujones||[]).length;

  /* acantilado: se avisa ANTES de la fecha */
  if(f==="acantilado"){
    var faltan=t.f_vigente?dDif(hoy(),t.f_vigente):99;
    if(faltan<=cfg.avisa_antes)
      return {por:"acantilado_cerca",
        texto:"“"+t.nombre+"” vence "+(faltan<=0?"hoy":"en "+faltan+" día"+(faltan===1?"":"s"))+
              " y pasada la fecha ya no sirve de nada. "+(t.duenio?PERSONAS[t.duenio].nombre:"")+
              " todavía no la cierra."};
  }
  if(!cfg.escala) return null;
  var acum=danioAcumulado(t);
  if(acum<=0) return null;
  if(f==="escalonado" && acum<2) return null;              // la primera vuelta no sube
  if(toques<cfg.toques_antes_de_subir) return null;        // primero la persigo yo

  return {por:"danio", vueltas:acum,
    texto:"“"+t.nombre+"”: "+(f==="escalonado"
      ? acum+" vueltas perdidas seguidas"
      : acum+" días vencida")+
      ". Le pregunté "+toques+" "+(toques===1?"vez":"veces")+" y sigue igual."};
}

/* lo que yo hago antes de molestar a nadie.
   'dicho' es el texto que escribió Claude para ESTA tarea. Si no llegó (sin
   internet, sin proxy, o contestó cualquier cosa), se usa el texto de siempre:
   el correteo NUNCA se detiene porque la IA no contestó. */
function empujon(t, dicho){
  t.empujones=t.empujones||[];
  var n=t.empujones.length, f=formaDanio(t), r=ritmo(t);
  var txt;
  if(dicho && String(dicho).trim().length>8){ txt=String(dicho).trim(); }
  else if(r && !danioAcumulado(t)){
    txt = r.va_a_fallar
      ? "Vas "+r.atraso+" día"+(r.atraso===1?"":"s")+" atrás en “"+r.paso+"”. Todavía no vence, pero con lo que queda ya no alcanza. ¿Qué necesitas para destrabarlo hoy?"
      : "Te falta “"+r.paso+"”, que debía estar hace "+r.atraso+" día"+(r.atraso===1?"":"s")+". ¿Lo sacas hoy?";
  } else if(n===0){
    txt="Ya venció “"+t.nombre+"”. ¿Por qué no la terminaste, y para cuándo la acabas?";
  } else if(n===1){
    txt="Segunda vez que te pregunto por “"+t.nombre+"”. Necesito una fecha, no un “ahorita”.";
  } else {
    txt="Van "+(n+1)+" veces. Si no la puedes sacar, dilo y la movemos con Salvador — pero callado no se queda.";
  }
  t.empujones.push({f:hoy(),t:txt});
  msg(t,"bal",txt);
  guarda(t);
  return txt;
}

/* ================= EL CORRETEO — el barrido que trabaja solo =================
   Build 56, 2026-09-04. Hasta aquí barrido() estaba escrito pero NADIE lo
   llamaba: el motor de escalamiento existía y nunca corría.

   DÓNDE CORRE Y POR QUÉ AQUÍ. Corre en el teléfono, no en el servidor. La razón
   es la que más le importa a Salvador: el criterio de a quién se persigue y qué
   sube al jefe es DETERMINÍSTICO y vive en UN SOLO LUGAR (subeAlJefe, ritmo,
   danioAcumulado). Si se reescribiera en PHP para el cron, habría dos motores
   que con el tiempo dejan de decir lo mismo, y nadie se daría cuenta. Así que
   el que decide es este archivo, siempre.

   QUIÉN LO CORRE. El que abra la app barre TODAS las tareas, no solo las suyas:
   la colección es una sola y cualquier sesión abierta puede hacer el trabajo.
   Con que uno del equipo abra la app en el día, el correteo del día ya corrió.

   QUE NO SE REPITA. El candado real vive en Firestore, no en el teléfono:
   ultimoEmpujonHoy(t) y t.subio. Si dos personas abren la app al mismo tiempo,
   el primero que escribe deja marcada la tarea y el segundo ya no la toca.

   LA VOZ. El motor decide A QUIÉN se le habla; Claude solo REDACTA. Si Claude
   no contesta, el correteo sigue con el texto de siempre — jamás se detiene por
   la IA. Y nunca se inventa un dato: Claude solo recibe lo que ya está escrito.

   LOS AVISOS. La app no manda el push: deja el aviso escrito en la cola
   (bitacora_avisos) y barrido.php lo entrega. El servidor es el cartero, no
   decide nada. */
var COLA="bitacora_avisos";
var correteoCorrido=0;

/* un aviso que hay que hacerle llegar a alguien aunque traiga la app cerrada */
function encola(para, titulo, cuerpo, tareaId){
  if(!db || !para || !PERSONAS[para]) return;
  var id="a"+uid();
  db.collection(COLA).doc(id).set({
    id:id, para:para,
    titulo:String(titulo||"Doit").slice(0,60),
    cuerpo:String(cuerpo||"").slice(0,240),
    tarea:tareaId||"", creado:Date.now(), dia:hoy(), enviado:false
  }).catch(function(){});
}

/* lo que el motor escogió, contado en corto para que Claude lo redacte */
function fichaCorreteo(s,i){
  var t=s.t, r=s.ritmo;
  var o={n:i, tarea:t.nombre,
    de:(PERSONAS[t.duenio]&&PERSONAS[t.duenio].nombre)||t.duenio||"",
    toques:(t.empujones||[]).length};
  var d=t.f_vigente?dDif(t.f_vigente,hoy()):0;
  if(d>0) o.vencida_hace=d+(d===1?" día":" días");
  if(r){ o.paso_atrasado=r.paso; o.atraso=r.atraso; if(r.va_a_fallar) o.ya_no_alcanza=true }
  if(t.cierra) o.cierra_con=t.cierra;
  var m=(t.msgs||[]).filter(function(x){return x.k==="bo"});
  if(m.length) o.lo_ultimo_que_contesto=String(m[m.length-1].t).slice(0,120);
  return o;
}

/* Claude redacta los empujones, TODOS en una sola llamada */
function vozDelCorreteo(sel, cb){
  var emp=[]; sel.forEach(function(s,i){ if(s.tipo==="empujon") emp.push(fichaCorreteo(s,i)) });
  if(!emp.length || APP_TOKEN.indexOf("__")===0){ cb(null); return }
  var p=
   "Eres el que persigue las tareas en Duet, la bitacora de una oficina chica en "+
   "Mexico. El motor ya decidio a quien hay que apretar; tu SOLO REDACTAS el "+
   "mensaje que le va a caer en su chat.\n"+
   "COMO SE ESCRIBE: le hablas de tu a la persona responsable, en español de "+
   "Mexico, directo y sin saludo ni preambulo. MAXIMO 2 renglones. Le pides algo "+
   "CONCRETO: una fecha o que diga que la traba. Si ya se le pregunto varias "+
   "veces (mira 'toques'), le subes el tono sin faltarle al respeto. Si lo "+
   "ultimo que contesto fue un 'ahorita' o algo sin fecha, se lo cobras.\n"+
   "PROHIBIDO: inventar datos, montos o fechas que no vengan abajo; regañar por "+
   "regañar; escribir mas de 2 renglones; poner el nombre de la persona al "+
   "principio como si fuera carta.\n"+
   "Contesta SOLO un JSON, la llave es el numero 'n' de cada una:\n"+
   '{"0":"texto","3":"texto"}\n\n'+
   "LAS TAREAS:\n"+JSON.stringify(emp);
  preguntaAClaude([{role:"user",content:p}],"rapido",function(txt,err){
    if(err||!txt){ cb(null); return }
    var j=null;
    try{ var m=txt.match(/\{[\s\S]*\}/); j=m?JSON.parse(m[0]):null }catch(e){ j=null }
    cb(j);
  });
}

/* EL CORRETEO. Se llama al abrir la app y cada media hora mientras siga abierta. */
function correteo(){
  if(!db || !listo) return;
  if(Date.now()-correteoCorrido < 25*60000) return;
  correteoCorrido=Date.now();

  var sel=[];
  tareas.forEach(function(t){
    if(t.cierre || esEjemplo(t) || t.es_recordatorio) return;
    var sube=subeAlJefe(t);
    if(sube){ if(t.subio!==hoy()) sel.push({t:t, tipo:"jefe", aviso:sube}); return }
    var r=ritmo(t), venc=dDif(t.f_vigente||hoy(),hoy())>0;
    if((r||venc) && ultimoEmpujonHoy(t)!==hoy()) sel.push({t:t, tipo:"empujon", ritmo:r});
  });
  if(!sel.length) return;

  vozDelCorreteo(sel, function(voz){
    sel.forEach(function(s,i){
      var t=s.t;
      if(s.tipo==="empujon"){
        /* si otra sesión ya lo apretó mientras Claude redactaba, ya no */
        if(ultimoEmpujonHoy(t)===hoy()) return;
        var txt=empujon(t, voz?voz[String(i)]:null);
        encola(t.duenio, "Doit", txt, t.id);
      } else {
        if(t.subio===hoy()) return;
        t.subio=hoy(); guarda(t);
        /* El aviso de escalamiento va SOLO a los jefes de verdad. Josué y
           Carlos traen jefe:true nada más para cazar fallas durante la prueba
           (prueba:true): avisarles del riego del fraccionamiento sería puro
           ruido para ellos. */
        Object.keys(PERSONAS).forEach(function(k){
          if(PERSONAS[k] && PERSONAS[k].jefe && !PERSONAS[k].prueba)
            encola(k, "Se te subió una", s.aviso.texto, t.id);
        });
      }
    });
    if(typeof render==="function") render();
  });
}

/* El barrido viejo se borró en el build 63: lo reemplazó correteo(), y dejar
   dando vueltas una segunda función que también escribe en los chats de la
   gente es justo como se cuelan los mensajes dobles. */
function ultimoEmpujonHoy(t){
  var e=t.empujones||[]; return e.length?e[e.length-1].f:null;
}

/* el resumen de una línea. NADA SE ESCONDE, SOLO SE APLAZA:
   lo que no escaló aparece aquí de todos modos. */
function resumenDelDia(){
  var vivas=tareas.filter(function(t){return !t.cierre});
  var venc=vivas.filter(function(t){return estadoReal(t)==="vencida"});
  var mal=vivas.filter(function(t){var r=ritmo(t); return r&&r.va_a_fallar});
  var sube=vivas.filter(subeAlJefe);
  return {
    vivas:vivas.length, en_tiempo:vivas.length-venc.length,
    vencidas:venc.length, mal_ritmo:mal.length, para_ti:sube.length,
    linea: vivas.length+" tareas vivas, "+(vivas.length-venc.length)+" en tiempo."+
      (venc.length?" "+venc.length+" vencida"+(venc.length===1?"":"s")+": "+
        venc.slice(0,3).map(function(t){return t.nombre.split(" · ")[0]}).join(", ")+".":"")+
      (mal.length?" "+mal.length+" va"+(mal.length===1?"":"n")+" a fallar por ritmo.":"")
  };
}

/* ---- LA ETIQUETA DE CADA TAREA. La pone Claude, no el empleado. ---- */
var REGLAS={
  linea:      {recuperable:true,  criticidad:"normal", f:7,  per:null,      danio:"plano"},
  pipas:      {recuperable:false, criticidad:"diario", f:0,  per:"semanal", dia_fijo:true, danio:"escalonado"},
  palmas:     {recuperable:true,  criticidad:"normal", f:-7, per:null,      danio:"plano"},
  bomba:      {recuperable:true,  criticidad:"diario", f:-1, per:null,      danio:"acantilado"},
  aspersor11: {recuperable:true,  criticidad:"normal", f:3,  per:null,      danio:"plano"},
  rondin:     {recuperable:false, criticidad:"normal", f:0,  per:"semanal", dia_fijo:true, danio:"escalonado"}
};
SEMILLA.forEach(function(t){
  var r=REGLAS[t.id]; if(!r) return;
  t.recuperable=r.recuperable; t.criticidad=r.criticidad; t.danio=r.danio||"plano";
  t.periodicidad=r.per; t.dia_fijo=!!r.dia_fijo;
  t.f_original=dm(r.f); t.f_vigente=t.f_original;
  t.movidas=0; t.detenido=null; t.cierre=null;
});

/* ============ FOTOS: EXIF primero, luego comprimir ============ */
function leerExif(file,cb){
  var fr=new FileReader();
  fr.onload=function(e){
    var out={};
    try{
      var dv=new DataView(e.target.result);
      if(dv.getUint16(0)===0xFFD8){
        var off=2,len=dv.byteLength;
        while(off<len-4){
          if(dv.getUint16(off)===0xFFE1){ out.exif=true; break }
          off+=2+dv.getUint16(off+2);
        }
      }
    }catch(err){}
    out.tomada=file.lastModified?new Date(file.lastModified).toISOString():null;
    cb(out);
  };
  fr.readAsArrayBuffer(file.slice(0,131072));
}
function comprime(file,cb){
  leerExif(file,function(meta){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var W=1100, r=Math.min(1,W/img.width);

/* LO QUE VE EL JEFE EN SU PANTALLA — corregido el 2026-09-03.
   ESTABA MAL: decia "if(PERSONAS[yo].jefe) return true", o sea que a Salvador
   le caian TODAS las tareas de todos, incluidas las de Samuel que van al
   corriente. El lo cacho.
   LA REGLA, PARTE 13: "lo que Salvador ve: solo lo atrasado y lo que vence
   esta semana. Lo que yo llevo: todas las tareas, calladito."
   ASI QUE AHORA al jefe le llegan a la lista SOLO tres cosas:
     · las suyas
     · las que lo estan deteniendo a el (una autorizacion, un si o un no)
     · las que YA ESCALARON, segun subeAlJefe()
   Todo lo demas de los demas NO desaparece: se va al pie, en "En seguimiento
   mio", plegado. Nada se esconde, solo se aplaza.
   POR QUE IMPORTA: la app anterior murio por saturacion. Si al jefe le caen
   cientos de renglones deja de abrirla, y entonces no ve ni lo urgente. */
function leToca(t){
  if(t.duenio===yo) return true;                 // suya
  if(meDetiene(t)) return true;                  // alguien esta parado por el
  if(!PERSONAS[yo] || !PERSONAS[yo].jefe) return false;
  return !!subeAlJefe(t);                        // ya escalo
}
function mias(){
  /* EL BARRIDO CORRE SOBRE TODAS, no solo sobre las que se pintan: si no, una
     no recuperable de otro nunca se cerraria en la sesion del jefe. */
  tareas.forEach(function(t){
    if(t.cierre||!t.f_vigente||t.recuperable!==false) return;
    if(dDif(t.f_vigente,hoy())>0){
      t.cierre={tipo:"no_ejecutada",motivo:"no_recuperable",culpa:"suya",f:hoy()};
      t.estado="no_ejecutada";
      msg(t,"bal","Se pasó la hora y esta tarea no admite entrega tarde. Se cierra y sale de tu lista. Salvador la ve en el semáforo.");
      guarda(t);
    }
  });
  /* los RECORDATORIOS no son tareas: no llevan semaforo ni entran a los grupos.
     Se sacan aqui y se pintan en su propia seccion (misRecordatorios). */
  var base=tareas.filter(function(t){ return leToca(t) && !t.es_recordatorio && !t.pendiente_info });
  var vivas=base.filter(function(t){ return !(t.cierre&&t.cierre.tipo==="no_ejecutada") });
  /* el toque del día del atorado sale como una tarea más, hasta arriba */
  var toques=[];
  vivas.forEach(function(t){ var q=tareaDeToque(t); if(q&&(PERSONAS[yo].jefe||t.duenio===yo)) toques.push(q) });
  vivas.sort(function(a,b){
    var o={vencida:0,silencio:1,detenida:2,hoy:3,espera:4,abierta:5,por_ejecutar:6,cerrada:9};
    var ea=estadoReal(a), eb=estadoReal(b);
    var va=(o[ea]==null?(o[a.estado]==null?5:o[a.estado]):o[ea]);
    var vb=(o[eb]==null?(o[b.estado]==null?5:o[b.estado]):o[eb]);
    return va-vb;
  });
  return toques.concat(vivas);
}

/* ===== LO HABLADO LARGO NO SE HACE CHORIZO (Salvador 2026-09-17) =====
   Se guarda COMPLETO (transcript) pero se muestra un resumen mío de 2-3
   renglones; a un toque sale el texto exacto. Un dictado corto se muestra tal
   cual, sin colapsar. El resumen bueno lo hace Claude en segundo plano; mientras,
   se pone uno local para que se vea al instante. Nunca sustituye tus palabras. */
function esLargo(txt){ txt=String(txt||""); return txt.length>170 || (txt.match(/[.?!]/g)||[]).length>=3; }
function localResumen(txt){
  txt=String(txt||"").trim().replace(/\s+/g," ");

  if(s.length>170) s=s.slice(0,167).replace(/\s+\S*$/,"")+"…";
  return s;
}

    "datos clave que haya dicho (quién, cuándo, dónde, cuánto). NO inventes nada que no esté "+

  preguntaAClaude([{role:"user",content:sys+"\n\nDICTADO:\n"+transcript}], "rapido", function(txt,err){

      vuelvePlay(window.__leyBtn); return; }

/* saca una fecha "26 de septiembre" / "2026-09-26" de un texto -> ISO, o null.
   Si el dia/mes ya paso este anio, se va al que viene. (Era codigo inline de
   mandar(); se saco aparte el 2026-09-22 para usarlo tambien al dictar directo.) */
function fechaEnTexto(txt){
  var mm=String(txt||"").match(/(\d{1,2})\s*(?:de\s+)?([a-z\u00e1\u00e9\u00ed\u00f3\u00fa]+)|(\d{4}-\d{2}-\d{2})/i);
  if(!mm) return null;
  if(mm[3]) return mm[3];
  var MES={enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,
    septiembre:8,setiembre:8,octubre:9,noviembre:10,diciembre:11};
  var k=String(mm[2]||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(MES[k]==null) return null;
  var d=new Date(); d.setMonth(MES[k]); d.setDate(+mm[1]);
  if(dDif(iso(d),hoy())>0) d.setFullYear(d.getFullYear()+1);
  return iso(d);
}
function mandar(t,txt){
  guardaHablado(t,"bo",txt);
  t.ultima=PERSONAS[yo].nombre+": "+(esLargo(txt)?localResumen(txt):txt);

  /* Salvador 2026-09-24: una tarea cerrada no sigue esperando nada; lo que se
     escribe ahi es comentario (antes repetia "Todavia me falta..." sin parar). */
  if(t.cierre){ t.pide_atoro=false; t.pide_tel=false; t.pide_fecha=false; }

  /* ---- "regresa lo que acabo de borrar / deshacer": SOLO si lo ultimo borrado
     es ESTA tarea. Salvador 2026-09-24: "reactivar" en una tarea cerrada
     deshizo el cierre de OTRA (la del golf) y lo brinco alla. ---- */
  if(/\b(deshac\w*|regres\w*|devuelv\w*|vuelve a poner)\b/i.test(txt) && window.__ultimoDeshacer && window.__ultimoDeshacer.id===t.id && (Date.now()-window.__ultimoDeshacer.cuando)<10*60*1000){
    if(deshaceSalto()){ msg(t,"bi","Listo, lo regresé."); guarda(t); }
    return;
  }

  /* ---- REABRIR UNA TAREA CERRADA DESDE EL CHAT (Salvador 2026-09-24): "hay
     que reactivarla", "se me paso", "falto hacer otra llamada", "abrela". Se
     queda en la misma tarea; si su fecha ya paso, se pide la nueva. ---- */
  var _sr=String(txt||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(t.cierre && /\b(reactiv\w*|reabr\w*|se me paso|falt(o|a|an|aron) (hacer|otra|otro|una|un|algo|la|el|que)|no (esta|quedo|quedaron|quedaba) (lista|hecha|terminada|completa)|abrela|abrirla|vuelve(la)? a abrir|regres\w*|devuelv\w*|reviv\w*|sigue pendiente|no la (cierres|des por))\b/.test(_sr)){
    reabre(t, txt); return;
  }

  /* ---- ATORADO, hablando (Salvador 2026-09-24): con el nombre basta; el
     telefono se pide despues, en una linea, solo si no esta en el directorio. */
  var _sa=String(txt||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  if(t.pide_tel){
    var telx=(txt.match(/(\+?\d[\d\s\-()]{7,})/)||[])[1]||"";
    t.pide_tel=false;
    if(telx && t.detenido){ t.detenido.tel=telx.replace(/[\s\-()]/g,""); msg(t,"bi","Listo, ya lo tengo."); }
    else msg(t,"bi","Va, sin teléfono por ahora. Cuando lo tengas me lo pasas.");
    guarda(t); return;
  }
  var _dice=t.pide_atoro || /\b(esper(o|ando|amos)|atorad|detenid|trabad|depend(o|e|iendo)|me falta que)\b/.test(_sa);
  if(_dice && !t.cierre){
    var _m=txt.match(/\b(?:a|de|por|con)\s+([A-ZÁÉÍÓÚ][\wáéíóú]+(?:\s+[A-ZÁÉÍÓÚ][\wáéíóú]+)?)/);
    var quien=_m?_m[1]:(t.pide_atoro?(txt.split(/[,;]/)[0]||"").trim():"");
    if(!quien){ t.pide_atoro=true; msg(t,"bi","¿Quién te está deteniendo?"); guarda(t); return; }
    var tel=(txt.match(/(\+?\d[\d\s\-()]{7,})/)||[])[1]||"";
    var que=(txt.match(/\b(?:por|para|que me|el|la|los|las)\s+(.{4,80})$/i)||[])[1]||"su parte";
    var fuera=/proveedor|electric|eléctric|taller|agronom|agrónom|plomer|jardiner|cotiza|presupuesto/i.test(txt);
    t.pide_atoro=false;
    declaraAtorado(t,quien,tel,que,fuera);
    t.ultima="Detenida: espera a "+quien;
    var _conocido=Object.keys(PERSONAS).some(function(k){ return (PERSONAS[k].nombre||"").toLowerCase()===quien.toLowerCase().split(" ")[0]; });
    if(!_conocido && !tel){ t.pide_tel=true; msg(t,"bi","No tengo a "+quien+" en el directorio. ¿Me pasas su teléfono?"); }
    guarda(t); return;
  }

  /* ---- MOVER FECHA dictado directo (Salvador 2026-09-22): "mueveme la fecha
     al 26 de septiembre" en el hilo antes no hacia NADA (solo funcionaba por el
     menu "..."). Ahora: verbo de mover + fecha = se toma. Si trae motivo
     ("porque ..."), se mueve; si no, se guarda la fecha y se pide el motivo. ---- */
  var _sn=String(txt||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(!t.pide_fecha && /\b(muev\w*|mov\w*|cambi\w*|pas(a|ala|ame|amela|ar|arla)|pospon\w*|reprogram\w*|recorr\w*|aplaz\w*)\b/.test(_sn)
     && (/\bfecha\b/.test(_sn) || fechaEnTexto(txt))){
    var _fx=fechaEnTexto(txt);
    var _mot=(txt.match(/\b(?:porque|por que|porqu\u00e9|ya que|debido a)\b\s*(.+)$/i)||[])[1]||"";
    if(!_fx){ t.pide_fecha=true; msg(t,"bi","\u00bfPara cu\u00e1ndo, y por qu\u00e9?"); guarda(t); return; }
    if(_mot.trim().length<8){
      t.pide_fecha=true; t.fecha_pendiente=_fx;
      msg(t,"bi","Va, al "+fechaBonita(_fx)+". \u00bfPor qu\u00e9? Escribe el motivo abajo; sin motivo por escrito no se mueve.");
      guarda(t); return;
    }
    var _r0=mueveFecha(t,_fx,_mot.trim()); if(!_r0.ok) msg(t,"bi",_r0.msg);
    guarda(t); return;
  }

  /* ---- reabierta con fecha vencida: solo hace falta la nueva fecha ---- */
  if(t.reabre_fecha){
    var _nf=fechaEnTexto(txt)||diaDicho(txt);
    if(!_nf){ msg(t,"bi","No le entendí la fecha. Dime por ejemplo: el lunes, o 3 de octubre."); guarda(t); return; }
    t.reabre_fecha=false; t.pide_fecha=false; t.f_vigente=_nf;
    msg(t,"bi","Va, para el "+fechaBonita(_nf)+"."); sincronizaAvisos(t); guarda(t); return;
  }

  /* ---- está moviendo la fecha: necesita fecha Y motivo ---- */
  if(t.pide_fecha){
    var nueva=fechaEnTexto(txt), razon;
    if(nueva){ razon=txt.replace(/^[^,]*,\s*/,"").trim(); }
    else if(t.fecha_pendiente){ nueva=t.fecha_pendiente; razon=txt.trim(); }   /* ya dio la fecha, esto es el motivo */
    if(!nueva){ msg(t,"bi","No le entendí la fecha. Escríbela así: 12 de septiembre, y luego el motivo."); guarda(t); return }
    if(razon.length<8){ msg(t,"bi","Falta el motivo por escrito. Sin eso no se mueve."); guarda(t); return }
    t.pide_fecha=false; t.fecha_pendiente=null;
    var r=mueveFecha(t,nueva,razon);
    if(!r.ok) msg(t,"bi",r.msg);
    guarda(t); return;
  }

  /* ---- está contestando el toque del día ---- */
  if(t.espera_toque){
    t.espera_toque=false;
    toqueHecho(t,txt);
    if(/ya (me |nos )?(contest|mand|dio|entreg)|quedamos|ya me lo pas/i.test(txt)) destrabar(t);
    return;
  }

  if(/autoriza|presupuesto|permiso|cuánto|cuanto/i.test(txt) && !PERSONAS[yo].jefe){
    t.estado="espera"; t.espera="salvador"; t.espera_desde=Date.now();
    msg(t,"bi","Se lo paso a Salvador. Te aviso en cuanto conteste.");
  }
  guarda(t);
}
/* "MUY CARO" — no es un "no" seco. Claude mira el monto y el concepto y propone
   2-3 caminos concretos para bajarlo o resolverlo (pedir descuento y de cuánto,
   más cotizaciones, reducir alcance, posponer). El jefe escoge y eso se le manda
   a la persona. Salvador 2026-09-04. */
function muyCaro(t){
  negociar={id:t.id, cargando:true}; render();
  var defecto=["Pide 10-15% de descuento y dime cuánto lograste",
               "Consigue otras 2 cotizaciones para comparar",
               "Reduce el alcance o pospón lo que no urge"];
  if(APP_TOKEN.indexOf("__")===0){ negociar={id:t.id, mensaje:"¿Cómo lo bajamos?", ops:defecto}; render(); return; }
  var sys="Eres el asesor del jefe de una oficina. Le pidieron autorizar un gasto y "+
    "se le hace CARO. Propon 2 o 3 caminos CONCRETOS y cortos para bajarlo o "+
    "resolverlo: pedir descuento (di un % o monto objetivo), pedir mas cotizaciones "+
    "si aplica, reducir el alcance, o posponer parte. Cada opcion es la instruccion "+
    "que se le mandaria a la persona, en imperativo corto (max 9 palabras). "+
    "CONTESTA SOLO JSON: {\"mensaje\":\"<una linea>\",\"opciones\":[\"..\",\"..\",\"..\"]}\n\n"+
    "GASTO: "+(t.gasto||"(sin monto)")+"\nCONCEPTO: "+(t.revisar||t.nombre||"")+
    "\nULTIMO MENSAJE: "+(((t.msgs||[]).filter(function(x){return x.k==="bo"}).slice(-1)[0]||{}).t||"");
  preguntaAClaude([{role:"user",content:sys}],"rapido",function(txt,err){
    if(negociar==null||negociar.id!==t.id) return;   /* ya se salió */
    var j=null; try{ var m=txt&&txt.match(/\{[\s\S]*\}/); j=m?JSON.parse(m[0]):null }catch(e){}
    var ops=(j&&j.opciones&&j.opciones.length)?j.opciones.slice(0,3):defecto;
    negociar={id:t.id, mensaje:(j&&j.mensaje)||"¿Cómo lo bajamos?", ops:ops};
    render();
  });
}

/* ---- cerrar: el criterio manda, no el botón ---- */
function intentaCerrar(t){
  var faltan=[];
  if(t.puntos){ var n=Object.keys(t.marcados||{}).length;
    if(n<t.puntos.length) faltan.push("faltan "+(t.puntos.length-n)+" puntos del rondín") }
  if(/foto/i.test(t.cierra||"") && !(t.evidencias&&t.evidencias.length) && !t.puntos) faltan.push("falta la foto");
  if(/ticket/i.test(t.cierra||"") && !(t.evidencias&&t.evidencias.length>1)) faltan.push("falta el ticket");
  if(faltan.length){
    msg(t,"bi","Todavía no la puedo cerrar: "+faltan.join(" y ")+". Eso fue lo que se escribió cuando nació la tarea.");
    guarda(t); return false;
  }
  if(t.pasos && (t.paso||0) < t.pasos.length-1){
    t.paso=(t.paso||0)+1; t.estado="espera_dia";
    t.ultima="Siguiente paso: "+t.pasos[t.paso].t;
    msg(t,"bi","Listo. Te desaparezco de la lista hasta que toque: "+t.pasos[t.paso].t+". La fecha final no se movió.");
    guarda(t); return true;
  }
  cierraHecha(t);
  return true;
}

/* EL TECLADO NO SE CIERRA AL MANDAR — Salvador 2026-09-24. Antes cada render()
   reemplazaba TODO el hilo, la caja de escribir incluida; al destruirla el
   telefono cerraba el teclado en el acto. Como WhatsApp: si la caja tiene el
   foco y sigue siendo la misma tarea, se repinta todo MENOS la barra (.pie),
   que se queda viva en su lugar. Solo cambia su placeholder. */
function pintaHilo(a){
  var oldPie=a.querySelector(".comp > .pie"), ae=document.activeElement;
  var keep=vista==="hilo" && oldPie && a.__hiloId===abierta && ae && oldPie.contains(ae);
  if(!keep){ a.innerHTML=vHilo(); a.__hiloId=abierta; return; }
  var tmp=document.createElement("div"); tmp.innerHTML=vHilo();
  var newComp=tmp.querySelector(".comp"), newPie=newComp&&newComp.querySelector(".pie");
  if(!newPie){ a.innerHTML=tmp.innerHTML; a.__hiloId=abierta; return; }
  var oldComp=oldPie.parentNode;
  Array.prototype.slice.call(a.childNodes).forEach(function(n){ if(n!==oldComp) a.removeChild(n); });
  Array.prototype.slice.call(oldComp.childNodes).forEach(function(n){ if(n!==oldPie) oldComp.removeChild(n); });
  var despues=false;
  Array.prototype.slice.call(tmp.childNodes).forEach(function(n){
    if(n===newComp){
      Array.prototype.slice.call(newComp.childNodes).forEach(function(c){ if(c!==newPie) oldComp.insertBefore(c, oldPie); });
      despues=true;
    } else if(!despues) a.insertBefore(n, oldComp); else a.appendChild(n);
  });
  var ot=oldPie.querySelector("#txt"), nt=newPie.querySelector("#txt");
  if(ot&&nt) ot.setAttribute("data-ph", nt.getAttribute("data-ph")||"");
  a.__hiloId=abierta;
}

/* SWIPE ENTRE TAREAS — Salvador 2026-09-17. Dentro de una tarea o recordatorio,
   deslizar a la izquierda pasa a la SIGUIENTE y a la derecha a la ANTERIOR, en el
   MISMO orden en que están pintadas en la lista (window.ordenSwipe, que se arma en
   bindLista leyendo el DOM). Así no hay que volver al home para brincar de una a
   otra: los botones de "ya la hice / no" van a la mano en cada una. */
function swipeATarea(dir){
  var ord=window.ordenSwipe||[]; if(!ord.length) return;
  var i=ord.indexOf(abierta); if(i<0) return;
  var j=i+dir;
  if(j<0){ toast("Es la primera"); return }
  if(j>=ord.length){ toast("Es la última"); return }
  var sig=tareas.filter(function(x){return x.id===ord[j]})[0];
  if(!sig){ return }
  abierta=ord[j]; vista="hilo"; fichaOpen=false; detOpen={}; menuOpen=false;
  render();
}
/* Se monta UNA sola vez: #app es un elemento estable, así que sus listeners
   sobreviven a los render(); si se re-montara en cada bindHilo se dispararían
   varias veces. El handler lee el estado vivo (vista, abierta). */
function montaSwipeUnaVez(){
  if(window.__swipeOn) return; window.__swipeOn=true;
  var app=$("app"); if(!app) return;
  var x0=0,y0=0,t0=0,ok=false;
  function zonaViva(el){
    return !!(el&&el.closest&&el.closest('input,textarea,[contenteditable="true"],.caja,.barra,.pie,.galgrid,.tira,.hoja,.top,button'));
  }
  /* Como WhatsApp: el teclado se cierra al tocar cualquier parte que no sea
     la barra de escribir ni un boton (Salvador 2026-09-24). */
  app.addEventListener('touchend',function(ev){
    var ae=document.activeElement;
    if(!(ae && ae.id==="txt" && ae.isContentEditable)) return;
    var el=ev.target;
    if(el && el.closest && el.closest('.pie,.sug,.hoja,button,input,textarea,[contenteditable="true"]')) return;
    ae.blur();
  },{passive:true});
  app.addEventListener('touchstart',function(ev){
    ok=false;
    if(vista!=="hilo") return;
    if(!ev.touches||ev.touches.length!==1) return;
    if(zonaViva(ev.target)) return;
    x0=ev.touches[0].clientX; y0=ev.touches[0].clientY; t0=Date.now(); ok=true;
  },{passive:true});
  app.addEventListener('touchend',function(ev){
    if(!ok) return; ok=false;
    if(vista!=="hilo") return;
    var c=(ev.changedTouches&&ev.changedTouches[0]); if(!c) return;
    var dx=c.clientX-x0, dy=c.clientY-y0;
    if(Date.now()-t0>800) return;          /* muy lento: no es swipe */
    if(Math.abs(dx)<70) return;            /* muy corto */
    if(Math.abs(dx)<Math.abs(dy)*1.7) return; /* iba vertical: es scroll */
    swipeATarea(dx<0?1:-1);                /* izq -> siguiente, der -> anterior */
  },{passive:true});
  /* flechas del teclado, para escritorio y pruebas */
  document.addEventListener('keydown',function(ev){
    if(vista!=="hilo") return;
    var a=document.activeElement;
    if(a&&a.closest&&a.closest('input,textarea,[contenteditable="true"],.caja')) return;
    if(ev.key==="ArrowLeft"){ swipeATarea(-1); }
    else if(ev.key==="ArrowRight"){ swipeATarea(1); }
  });
}

function vLista(){
  var esJefe=PERSONAS[yo].jefe;
  var det=loQueDetengo();
  var arr=mias(), mis=misEncargos();
  /* Salvador 2026-09-22: las ya hechas/eliminadas (tachadas) NO se pintan en el
     home, ensucian la lista. Siguen en el buscador ("lo que hice hoy") y al
     abrirlas por voz. */
  arr=arr.filter(function(t){ return !t.cierre && estadoReal(t)!=="cerrada"; });
  var res=esJefe?resumenDelDia():null;
  h='<div class="enc" id="enc">'+
    '<div class="r1"><div class="nom" id="byo" role="button">'+esc(PERSONAS[yo].nombre)+'</div>'+
    '<div class="grow"></div>'+
    (esJefe?'<button class="eng" id="badm" aria-label="Ajustes">'+ico("eng",24,1.6)+'</button>':'')+'</div>'+
    '</div>';

  h+='<div class="scroll">';

  if(consulta){
    var enc=busca(consulta);
    h+='<div class="grp">Resultado \u00b7 '+enc.length+'</div><ul class="list">';
    if(!enc.length) h+='<li class="vacio">No encontr\u00e9 nada con eso.</li>';
    enc.forEach(function(t){ h+=fila(t) });
    h+='</ul><div class="pieacc"><button class="op" id="bclr">Limpiar b\u00fasqueda</button></div></div>';
    return h+barraPie();
  }

  h+=bannerAvisos();

  var msgs=misMensajes();
  var pend=pendientesInfo();
  /* si la seccion abierta se quedo sin contenido (se resolvio la ultima
     pendiente/mensaje/traba), se cierra el acordeon solo */
  if(secAbierta==="pend" && !pend.length) secAbierta=null;
  if(secAbierta==="msg" && !msgs.length) secAbierta=null;
  if(secAbierta==="atora" && !det.length) secAbierta=null;

  h+=vRecienCreadas();

  /* ===== ACORDEON DE 7 SECCIONES DEL HOME — orden y color fijos, aprobados
     por Salvador 2026-09-22 (mock-up v3): 1 atoras a alguien (rojo) \u00b7
     2 con informacion pendiente (naranja oscuro) \u00b7 3 vencidas (amarillo) \u00b7
     4 avisos/mensajes sin leer (verde) \u00b7 5 hoy (azul) \u00b7 6 recordatorios
     (morado) \u00b7 7 proximas (gris). Solo UNA seccion abierta a la vez
     (secAbierta); el contenido de cada renglon queda siempre blanco/gris,
     nunca de color \u2014 lo unico que cambia por seccion es el icono y el
     puntito/franja. "Te encargaron" no es de las 7 con color: sigue igual,
     pegada despues de "Atoras a alguien". */

  var hAtora="";
  if(det.length){
    hAtora=secHead("atora","Atoras a alguien m\u00e1s",det.length,"sb-atora","warn");
    if(secAbierta==="atora"){
      hAtora+='<ul class="list">'; det.forEach(function(t){hAtora+=filaUrg(t)}); hAtora+='</ul>';
    }
  }

  var hMis="";
  if(mis.length){
    hMis='<div class="grp">Te encargaron \u00b7 '+mis.length+'</div><ul class="list">';
    mis.forEach(function(e){
      var venc=dDif(e.limite,hoy())>0;
      hMis+='<li><button class="row" data-enc="'+e.id+'">'+
        '<span class="dot '+(venc?"d-venc":"d-esper")+'"></span><span>'+
        '<span class="nm">'+esc(PERSONAS[e.de].nombre)+' te encarg\u00f3</span>'+
        '<span class="ls">'+esc(e.texto)+'</span></span>'+
        '<span class="meta">'+(venc?'<span class="bdg g-venc">!</span>':'<span class="bdg g-esper">1</span>')+
        '</span></button></li>';
    });
    hMis+='</ul>';
  }

  var hPend="";
  if(pend.length){
    hPend=secHead("pend","Con informaci\u00f3n pendiente",pend.length,"sb-pend","pencil");
    if(secAbierta==="pend"){
      hPend+='<div class="pendwrap">'; pend.forEach(function(t){hPend+=filaPend(t)}); hPend+='</div>';
    }
  }

  /* ---- UNA SOLA LISTA, NO PESTAÑAS. Decisión de Salvador 2026-09-04: no
     dividir por tipo de traba; atrasadas = Vencidas, lo que DETIENE A OTRO
     va aparte arriba (seccion "atora"). ---- */
  var mias_venc=arr.filter(function(t){return det.indexOf(t)<0 && estadoReal(t)==="vencida"});
  var resto=arr.filter(function(t){return det.indexOf(t)<0 && mias_venc.indexOf(t)<0});
  var hoyYa=resto.filter(function(t){return dDif(t.f_vigente||hoy(),hoy())>=0});
  var futuras=resto.filter(function(t){return dDif(t.f_vigente||hoy(),hoy())<0})
                   .sort(function(a,b){return (a.f_vigente||"").localeCompare(b.f_vigente||"")});

  var hVenc="";
  if(mias_venc.length){
    hVenc=secHead("venc","Vencidas",mias_venc.length,"sb-venc","calx");
    if(secAbierta==="venc"){ hVenc+='<ul class="list">';
      mias_venc.forEach(function(t){hVenc+=fila(t,false,"d-sec-venc")}); hVenc+='</ul>'; }
  }

  var hMsg="";
  if(msgs.length){
    hMsg=secHead("msg","Tienes mensajes sin leer",msgs.length,"sb-msg","chat");
    if(secAbierta==="msg"){ hMsg+='<ul class="list">';
      msgs.forEach(function(t){hMsg+=fila(t,false,"d-sec-msg")}); hMsg+='</ul>'; }
  }

  var hHoy="";
  if(hoyYa.length){
    hHoy=secHead("hoy","Hoy",hoyYa.length,"sb-hoy","hoja");
    if(secAbierta==="hoy"){ hHoy+='<ul class="list">'; hoyYa.forEach(function(t){hHoy+=fila(t,false,"d-sec-hoy")}); hHoy+='</ul>'; }
  } else {
    hHoy='<div class="hoyh"><b>Hoy</b></div><ul class="list">'+
      (futuras.length?'':'<li class="vacio">Nada para hoy.</li>')+'</ul>';
  }

  /* PRÓXIMAS — cuando no hay nada para hoy, en vez del hueco se ven las que
     vienen, agrupadas por dia. El horizonte se adapta al volumen. */
  var proxRestan=0, hProxBody="", dentro=[];
  if(!hoyYa.length && futuras.length){
    var base = futuras.length>=20 ? 2 : (futuras.length>=10 ? 4 : 8);
    var tope = base + masDias;
    var fuera=[];
    futuras.forEach(function(t){
      var ad = -dDif(t.f_vigente||hoy(), hoy());
      (ad<=tope ? dentro : fuera).push(t);
    });
    proxRestan=fuera.length;
    if(dentro.length && secAbierta==="prox"){
      var diaAnt="";
      dentro.forEach(function(t){
        var f=t.f_vigente||hoy();
        if(f!==diaAnt){
          if(diaAnt) hProxBody+='</ul>';
          var ad=-dDif(f,hoy());
          hProxBody+='<div class="proxd">'+esc(ad===1?"Ma\u00f1ana":fechaBonita(f))+'</div><ul class="list">';
          diaAnt=f;
        }
        hProxBody+=fila(t,true,"d-sec-prox");
      });
      hProxBody+='</ul>';
      if(proxRestan) hProxBody+='<div class="futwrap"><button class="futbtn" id="bmas">'+
        ico("cal",18,1.8)+'<span>Ver m\u00e1s \u00b7 '+proxRestan+'</span></button></div>';
    }
  }

  var recs=misRecordatorios();
  var hRec="";
  if(recs.length){
    hRec=secHead("rec","Recordatorios",recs.length,"sb-rec","bell");
    if(secAbierta==="rec"){
      hRec+='<ul class="list">';
      recs.forEach(function(t){
        hRec+='<li><button class="row" data-id="'+t.id+'">'+
          '<span class="rico">'+ico("bell",18,1.7)+'</span><span>'+
          '<span class="nm">'+esc(t.nombre)+'</span>'+
          '<span class="ls">te aviso el '+esc(fechaBonita(t.f_vigente))+'</span></span>'+
          '</button></li>';
      });
      hRec+='</ul>';
    }
  }

  var hProx="";
  if(dentro.length){
    hProx=secHead("prox","Pr\u00f3ximas",dentro.length,"sb-prox","cal")+hProxBody;
  }

  /* ===== orden final aprobado 2026-09-22 ===== */
  h+=hAtora+hMis+hPend+hVenc+hMsg+hHoy+hRec+hProx;

  if(futuras.length && hoyYa.length){
    h+='<div class="futwrap"><button class="futbtn" id="bfut">'+
       ico("cal",18,1.8)+'<span>'+(verFuturas?"Ocultar futuras":"Ver tareas futuras")+
       ' \u00b7 '+futuras.length+'</span></button></div>';
    if(verFuturas){
      h+='<ul class="list">';
      futuras.forEach(function(t){h+=fila(t)});
      h+='</ul>';
    }
  }

  /* ORDEN DEL SWIPE ENTRE TAREAS — Salvador 2026-09-22: el swipe (window.
     ordenSwipe) sigue el mismo orden de las 7 secciones AUNQUE esten
     plegadas, para que al llegar al final de "Hoy" siga solo con
     Recordatorios, luego Proximas, etc., sin detenerse por el acordeon.
     Antes se armaba leyendo los renglones pintados en pantalla; con el
     acordeon (solo una seccion pintada a la vez) eso ya no alcanzaba, asi
     que ahora se arma directo de las listas, en el mismo orden fijo. */
  (function(){
    var seen={}, out=[];
    function agrega(lista){
      lista.forEach(function(t){
        if(!seen[t.id]){ seen[t.id]=1; out.push(t.id); }
      });
    }
    agrega(det); agrega(pend); agrega(mias_venc); agrega(msgs);
    agrega(hoyYa); agrega(recs); agrega(dentro); agrega(futuras);
    window.ordenSwipe=out;
  })();

  /* LA PANTALLA ES SOLO TUYA — decision de Salvador, 2026-09-03. La pantalla
     del jefe muestra solo lo suyo y lo que lo detiene; lo de los demas se
     consulta preguntandole a Claude. */
  return h+'</div>'+barraPie();
}

var DIAS_L=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

/* la fecha, dicha corta y clara: hoy, mañana, el dia de la semana si es cerca,
   y dia+mes si ya es de otra semana. Salvador 2026-09-16, estilo limpio. */
function fechaChip(f){
  if(!f||!/^\d{4}-\d{2}-\d{2}$/.test(f)) return "";
  var ad=-dDif(f,hoy());
  if(ad===0) return "hoy";
  if(ad===1) return "mañana";
  if(ad===-1) return "ayer";
  var d=new Date(f+"T00:00:00");
  if(ad>=2 && ad<=6) return DIAS_L[d.getDay()];
  return d.getDate()+" "+MES_3[d.getMonth()];
}
function fila(t, mudo, secClass){
  var b=badge(t), enc=t.encargado, r=ritmo(t);
  /* Salvador 2026-09-22: si la fila se pinta dentro de una de las 7 secciones
     con color del home, el puntito toma el color de esa seccion; si no, sigue
     el estado real de la tarea (como siempre). */
  return '<li><button class="row'+(estadoReal(t)==="cerrada"?" done":"")+
    '" data-id="'+t.id+'"><span class="dot '+(secClass||(enc?"d-tenue":dotc(t)))+'"></span><span>'+

    (enc
      ? '<span class="ls"><span class="marcaje">→ '+esc(PERSONAS[enc.a].nombre)+'</span> · '+esc(esperaDe(t))+'</span>'
      : (r&&r.va_a_fallar
          ? '<span class="ls"><span class="alerta">va a fallar</span> · atrasado en “'+esc(r.paso)+'”</span>'
          : (t.pasos&&t.pasos[t.paso!=null?t.paso:0]&&estadoReal(t)!=="cerrada"
              ? '<span class="paso">→ '+esc(t.pasos[t.paso||0].t)+'</span>'

    '<span class="meta">'+((mudo?"":fechaChip(t.f_vigente))?'<span class="fdate">'+esc(fechaChip(t.f_vigente))+'</span>':'')+
    '<span class="tm">'+((t.duenio&&t.duenio!==yo&&PERSONAS[t.duenio])?PERSONAS[t.duenio].ini:"")+'</span>'+
    (b?(b.ico?'<span class="bico">'+b.ico+'</span>':'<span class="bdg">'+b.n+'</span>'):'')+'</span></button></li>';

/* CUÁNTO LLEVA ESPERANDO — Salvador 2026-09-04: primero en horas, luego en
   días, luego en semanas. Se mide contra t.espera_desde, la hora en que la
   tarea quedó parada esperándote. */
function esperaHace(t){
  if(!t.espera_desde) return "";
  var ms=Date.now()-t.espera_desde; if(ms<0) ms=0;
  var min=Math.floor(ms/60000);
  if(min<60) return min<=1?"un minuto":min+" minutos";
  var hrs=Math.floor(min/60);
  if(hrs<24) return hrs===1?"una hora":hrs+" horas";
  var dias=Math.floor(hrs/24);
  if(dias<14) return dias===1?"un día":dias+" días";
  return Math.round(dias/7)+" semanas";
}
/* El renglón de abajo de una urgente SIEMPRE dice quién y cuánto lleva parado. */
function quienEspera(t){
  var q=esperaHace(t);
  var nom=(t.duenio&&t.duenio!==yo&&PERSONAS[t.duenio])?PERSONAS[t.duenio].nombre:"";
  if(!q) return t.ultima||esperaDe(t)||"";
  return nom ? nom+" lleva "+q+" esperando" : "Lleva "+q+" esperando tu decisión";
}

   Estaba metido adentro de loQueDetengo() y por eso la lista del jefe no lo
   usaba: se le colaban las que esperan autorizacion SIN nombre puesto, que son
   justo las que traen a alguien parado. Salvador lo pidio: "tambien me tiene
   que llegar lo que yo tengo que autorizar para que otra persona no se frene."
   Los tres casos, y no hay mas:
     · la tarea espera y me nombra a mi
     · la tarea espera y NO nombra a nadie, y yo soy el jefe (por default sube)
     · alguien escribio que esta esperando algo de mi */
function meDetiene(t){
  if(!t || t.cierre) return false;
  if(t.estado==="espera" && (t.espera===yo || (PERSONAS[yo] && PERSONAS[yo].jefe && !t.espera))) return true;
  if(t.detenido && t.detenido.quien && PERSONAS[yo] &&
     String(t.detenido.quien).toLowerCase().indexOf(PERSONAS[yo].nombre.toLowerCase())>=0) return true;
  return false;
}
function loQueDetengo(){ return tareas.filter(function(t){ return meDetiene(t) && !t.pendiente_info }) }

/* EL PIE SUBE CON EL TECLADO.
   En iPhone, al abrirse el teclado la pagina NO se encoge: se queda del mismo
   alto y el teclado la tapa. Por eso el pie se sube a mano con lo que mide el
   teclado, que es lo que informa visualViewport. Asi queda pegado arriba del
   teclado, como en WhatsApp, y lo que dictas o escribes se ve siempre. */
(function(){
  var vv=window.visualViewport; if(!vv) return;
  /* SOLO es "tapado por teclado" si de veras hay un input/textarea enfocado:
     el teclado real de iOS nada mas sale entonces. Sin este candado, el
     indicador de grabacion del microfono (u otro cambio del viewport durante
     el dictado por voz) se confundia con el teclado y dejaba la barra de
     abajo empujada hacia arriba, con un hueco vacio debajo, sin que hubiera
     teclado ni texto que lo justificara — bug reportado por Salvador el
     2026-09-23 (recordatorio nuevo por voz que ademas se quedo trabado). */
  function tecladoReal(){
    var e=document.activeElement;
    return !!(e && (e.tagName==="INPUT"||e.tagName==="TEXTAREA"||e.isContentEditable));
  }
  function acomoda(){
    var pie=document.querySelector(".pie"); if(!pie) return;
    var tapado=tecladoReal() ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
    pie.style.transform = tapado>0 ? "translateY(-"+tapado+"px)" : "";
    var sc=document.querySelector(".scroll");
    if(sc) sc.style.paddingBottom = tapado>0 ? tapado+"px" : "";
  }
  vv.addEventListener("resize",acomoda);
  vv.addEventListener("scroll",acomoda);
  window.addEventListener("orientationchange",function(){setTimeout(acomoda,250)});
  document.addEventListener("focusin",function(){setTimeout(acomoda,60);setTimeout(acomoda,320)});
  document.addEventListener("focusout",function(){setTimeout(acomoda,60);setTimeout(acomoda,320)});
})();

/* ====== CAPA DE DICTADO — una sola, para todos los micrófonos ======
   Se abre al empezar a hablar y muestra en vivo lo que vas diciendo (lo ya
   reconocido en blanco, lo que todavía se está oyendo en gris), con las
   barritas de audio abajo. El botón "Listo" hace lo mismo que volver a tocar
   el micrófono. Salvador 2026-09-04. */
function barritasAudio(){
  var s="";
  for(var i=0;i<34;i++) s+='<i style="animation-delay:-'+((i*7)%70)/100+'s"></i>';
  return s;
}
function abreDictado(onListo,onCancel){
  cierraDictado();
  var el=document.createElement("div");
  el.className="dictacapa vivo"; el.id="dictacapa";
  /* UNA SOLA FILA, del mismo tamaño que la barra de escribir: basura, tiempo,
     onditas y avioncito. Sin bloque de texto arriba, para que no crezca ni empuje
     nada (Salvador 2026-09-17). */
  el.innerHTML='<div class="dfila">'+
      '<button class="dx" id="dictax" aria-label="Cancelar">'+svgBasura()+'</button>'+
      '<span class="dtime" id="dictatime">0:00</span>'+
      '<div class="dbars">'+barritasAudio()+'</div>'+
      '<button class="dok" id="dictaok" aria-label="Enviar">'+ico("sube",21,2.2)+'</button>'+
    '</div>';
  document.body.appendChild(el);
  var bo=document.getElementById("dictaok");
  if(bo) bo.onclick=function(){ if(typeof onListo==="function") onListo(); };
  var bx=document.getElementById("dictax");
  if(bx) bx.onclick=function(){ if(typeof onCancel==="function") onCancel();
                                else cierraDictado(); };
  window.__pausado=false;
  /* cronometro del dictado */
  window.__dictaSec=0;
  if(window.__dictaTimer) clearInterval(window.__dictaTimer);
  window.__dictaTimer=setInterval(function(){
    if(!document.getElementById("dictacapa")){ clearInterval(window.__dictaTimer); window.__dictaTimer=null; return }
    window.__dictaSec++;
    var tt=document.getElementById("dictatime");
    if(tt){ var mm=Math.floor(window.__dictaSec/60), ss=window.__dictaSec%60; tt.textContent=mm+":"+(ss<10?"0":"")+ss; }
  },1000);
  return el;
}
function svgBasura(){ return '<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M9 7V5.2h6V7M6.6 7l.9 11.3a1 1 0 0 0 1 .9h7a1 1 0 0 0 1-.9L18.4 7M10 10.6v5M14 10.6v5"/></svg>'; }
/* se llama en cada onresult: repinta y se va SOLO hasta abajo, para que el
   ultimo renglon dictado quede siempre a la vista */
function pintaDictado(){
  var c=document.getElementById("dictatxt"); if(!c) return;
  var firme=(window.__dicho||""), par=(window.__parcial||"");
  if(!firme.trim() && !par.trim()){ c.className="dtxt vacio"; c.textContent="Te escucho…"; return }

function cierraDictado(){
  var el=document.getElementById("dictacapa");
  if(el && el.parentNode) el.parentNode.removeChild(el);
  if(window.__dictaTimer){ clearInterval(window.__dictaTimer); window.__dictaTimer=null; }
  window.__pausado=false;
}
/* ===== ROBUSTEZ DEL MICROFONO EN IPHONE (build 81) =====
   El motor de Safari se corta solo cada rato. Antes se reprendia AL INSTANTE y
   en iPhone eso truena: quedaba muerto pero la onda seguia moviendose (la onda
   es pura animacion). Ahora: (1) al cortarse, se reprende con un respiro; (2) la
   onda solo se ilumina cuando el microfono de veras esta oyendo; (3) un vigilante
   detecta cuando quedo mudo y, en vez de dejar la onda falsa, lo apaga y avisa
   "tocalo otra vez" — asi ya no hay que cerrar la app. */
function marcaVivo(){
  window.__ultOye=Date.now(); window.__audioAbrio=true;
  var c=document.getElementById("dictacapa"); if(c) c.classList.add("vivo");
}
function paraVigia(){
  if(window.__oyeWatch){ clearInterval(window.__oyeWatch); window.__oyeWatch=null; }
}
/* RECARGA ULTRA LIGERA DEL MICROFONO (idea de Salvador 2026-09-16). En vez de
   recargar toda la app, se suelta el canal de audio que iOS deja agarrado tras
   una dictada y se limpian las banderas. Es puro JS, sin audio, imperceptible.
   Se llama al llegar al home y al empezar cada dictado, para que el canal SIEMPRE
   este fresco cuando el usuario pica el microfono. NO toca una dictada en curso. */
function recargaMic(){
  if(window.__oyendo) return;
  try{ if(window.__rec){ if(window.__rec.abort) window.__rec.abort(); else window.__rec.stop(); } }catch(e){}
  window.__rec=null; window.__audioAbrio=false; window.__gotSpeech=false;
  paraVigia();
}
/* ARRANQUE EN FRIO — el caso terco de Salvador: le picaba varias veces al
   microfono y no agarraba, y solo un reset destrababa. En iPhone, cuando el
   canal de audio de Safari se atora, ni creando microfonos nuevos revive: hay
   que recargar la pagina para que lo suelte. Aqui se hace SOLO, en silencio.
   Candados para no caer en un ciclo de recargas:
   - NO recarga en el primer intento tras abrir la app (por si es el permiso
     del microfono la primera vez).
   - NO recarga dos veces en 15s (si tras recargar sigue sin arrancar, ya no
     insiste: avisa por texto).
   - NO recarga si hay texto sin mandar en la barra (no se pierde nada). */
function reaccionaFrio(){
  var ahora=Date.now(), ult=0;
  try{ ult=+sessionStorage.getItem("bit_micReset")||0 }catch(e){}
  var bq=document.getElementById("bq");
  var hayTexto=bq && String(bq.textContent||"").trim();
  var primero=(window.__micIntentos||0) <= 1;
  if(!primero && !hayTexto && ahora-ult > 15000){
    try{ sessionStorage.setItem("bit_micReset", String(ahora)) }catch(e){}
    location.reload();
  } else {
    toast("El micrófono no arrancó, tócalo otra vez");
  }
}
function enlazaRec(r, stopFn){
  window.__micIntentos=(window.__micIntentos||0)+1;
  window.__audioAbrio=false; window.__inicioRec=Date.now();
  r.onaudiostart=marcaVivo; r.onspeechstart=marcaVivo; r.onsoundstart=marcaVivo;
  r.onend=function(){
    if(!window.__oyendo || window.__rec!==r) return;
    setTimeout(function(){
      if(!window.__oyendo || window.__rec!==r) return;
      try{ r.start(); }
      catch(e){
        setTimeout(function(){
          if(!window.__oyendo || window.__rec!==r) return;
          try{ r.start(); }
          catch(e2){ if(stopFn) stopFn(); toast("El micrófono se cortó, tócalo otra vez"); }
        }, 500);
      }
    }, 250);
  };
  paraVigia();
  window.__ultOye=Date.now();
  window.__oyeWatch=setInterval(function(){
    if(!window.__oyendo || window.__rec!==r){ paraVigia(); return; }
    if(window.__pausado){ window.__ultOye=Date.now(); window.__inicioRec=Date.now(); return; }
    var ahora=Date.now();
    if(!window.__audioAbrio && ahora-window.__inicioRec > 3200){
      paraVigia(); if(stopFn) stopFn(); reaccionaFrio(); return;
    }
    if(window.__audioAbrio && ahora-(window.__ultOye||0) > 9000){
      paraVigia(); if(stopFn) stopFn(); toast("El micrófono se cortó, tócalo otra vez");
    }
  }, 1200);
}

function busca(q){
  var ql=String(q).toLowerCase();
  /* por persona: "las vencidas de Samuel", "quién va mal de ritmo" */
  var quien=null;
  Object.keys(PERSONAS).forEach(function(k){
    if(ql.indexOf(PERSONAS[k].nombre.toLowerCase())>=0) quien=k;
  });
  /* "lo que hice hoy" / "las que terminé ayer" / "las hechas": solo cerradas.
     Salvador 2026-09-22 — las tachadas ya no salen en el home, se piden aqui. */
  if(/\b(hech[oa]s?|hice|hicimos|realic\w*|realizad\w*|termin\w*|logr\w*|cerrad\w*|tachad\w*|complet\w*|cumplid\w*)\b/.test(ql)){
    var diaH=/\bhoy\b/.test(ql)?hoy():(/\bayer\b/.test(ql)?dm(-1):null);
    return tareas.filter(function(t){
        if(!(t.cierre||estadoReal(t)==="cerrada")) return false;
        if(quien && t.duenio!==quien) return false;
        if(diaH) return (t.cierre&&t.cierre.f)===diaH;
        return true;
      }).sort(function(a,b){ return String((b.cierre||{}).f||"").localeCompare(String((a.cierre||{}).f||"")); });
  }
  var soloVenc=/vencid|atrasad|tarde|rojo/.test(ql);
  var soloRitmo=/ritmo|avance|va mal|van mal|atrasad/.test(ql);
  var base=tareas.filter(function(t){
    if(quien && t.duenio!==quien) return false;
    if(soloVenc && estadoReal(t)!=="vencida") return false;
    if(soloRitmo){ var r=ritmo(t); if(!r) return false }
    return true;
  });
  if(quien||soloVenc||soloRitmo) return base.filter(function(t){return !t.cierre});
  if(ql==="todo") return base.filter(function(t){return !t.cierre});
  var c=candidatas(q,null,true);   /* cerradas tambien: ya no se ven en el home */
  return c.length?c:base.filter(function(t){return !t.cierre});
}

/* los encargos que me hicieron a mí y siguen abiertos */
function misEncargos(){
  return encargos.filter(function(e){ return e.para===yo && !e.cerrado })
    .sort(function(a,b){ return dDif(b.limite,a.limite) });
}
function esperaDe(t){
  if(!t.encargado) return t.ultima||"";
  var e=encargos.filter(function(x){return x.id===t.encargado.id})[0];
  if(!e) return "encargado";
  if(e.cerrado) return "contestó";
  var d=dDif(e.creado?iso(e.creado):t.encargado.desde, hoy());
  return d<=0 ? "sin respuesta todavía" : "sin respuesta desde hace "+d+(d===1?" día":" días");
}

/* ====== EL HILO DE UNA REVISION ======

   atorado", que son del que ejecuta — tiene SUS botones: "Revisada" y

    '</div>';

  h+='<div class="revficha">'+
     '<div class="rq">Tarea de '+esc(qn)+'</div>'+
     '<div class="rn">'+esc(org.nombre)+'</div>'+
     '<div class="rl">'+pill+
       (org.f_vigente?' <span class="rd" style="margin-left:7px">para el '+esc(fechaBonita(org.f_vigente))+'</span>':'')+
     '</div>'+
     (org.creada_por && org.creada_por!==org.duenio && PERSONAS[org.creada_por]

     (org.cierra?'<div class="ru">Cierra con: '+esc(org.cierra)+'</div>':'')+
     (org.ultima?'<div class="ru">'+esc(org.ultima)+'</div>':'')+
     '</div>';

  /* su chat y su evidencia, tal cual */
  var m="";
  (org.msgs||[]).forEach(function(x){
    var q=autorMsg(x,org), meta=(q?esc(q)+" · ":"")+esc(x.h);
    m+='<div class="b '+(x.k==="bal"?"bal":(x.k==="bo"?"bo":"bi"))+'">'+esc(x.t)+
       '<span class="st">'+meta+'</span></div>';

  if(org.evidencias&&org.evidencias.length)
    m+='<div class="fot">'+org.evidencias.map(function(f){
         return '<img src="'+f.data+'" alt="evidencia">' }).join("")+'</div>';

  /* SUS botones, no los del que ejecuta */
  var sug = estadoReal(t)==="cerrada" ? ""
    : '<button class="op k" id="brevok">Revisada</button>'+

  return h+
    (posRev?'<div class="hoja"><button class="hop" data-pr="1">Mañana</button>'+

    '<div class="scroll"><div class="msgs">'+m+'</div></div>'+
    '<div class="comp">'+(sug?'<div class="sug">'+sug+'</div>':'')+
    '<div class="pie">'+
      '<div class="caja2">'+
        '<button class="mas" id="tcam" aria-label="Agregar foto">'+ico("mas",22,2)+'</button>'+
        '<div id="txt" class="caja vacia" contenteditable="true" role="textbox" '+
          'data-ph="'+(window.__avAdd===t.id?"Dicta o escribe el recordatorio":"")+'" enterkeyhint="send" '+
          'autocorrect="on" autocapitalize="sentences" spellcheck="true"></div>'+
        '<button class="env" id="tenv" aria-label="Enviar">'+ico("sube",21,2.2)+'</button>'+

  }
  /* "MUY CARO": pantalla limpia y centrada con las opciones grandes, SIN la ficha
     ni el chat (Salvador 2026-09-04). Se escoge una o se dicta otra. */
  if(negociar && negociar.id===t.id) return vNegociar(t);

    '</div>'+

      orden.map(function(i){var f=adj[i];return '<figure><img src="'+f.data+'" data-gi="'+i+'" alt="'+esc(f.de)+'">'+
        '<figcaption>'+esc(f.de)+'<br>'+fechaCorta(f.ts)+'</figcaption></figure>'}).join("")+
      '</div></div></div>';
  }
  /* LA FICHA GRIS — resumen clave, SIEMPRE desplegada (Salvador 2026-09-04).
     Deja fijo lo importante (sobre todo el MONTO) aunque el chat crezca: así una
     autorización nunca se decide con un precio que se fue para arriba. */
  var esMoney=/\d/.test(t.gasto||"") && !/no\s*gasta/i.test(t.gasto||"");
  var top = esMoney ? 'Autorización · <b>'+esc(t.gasto)+'</b>'
                    : 'Cierra con: <b>'+esc(t.cierra||"—")+'</b>';

  if(esMoney) _fr("Monto", t.gasto);

  _fr("Cierra con", t.cierra);
  if(t.f_vigente && !t.es_recordatorio) _fr("Para", fechaBonita(t.f_vigente));
  _fr("Ritmo", t.ritmo);
  /* los recordatorios YA NO se listan aquí: viven en el relojito y su hoja
     "Recordatorios de esta tarea" (Salvador 2026-09-18). */
  /* QUIÉN SE LA ASIGNÓ — Salvador 2026-09-04. Solo si se la mandó ALGUIEN MÁS:
     si el dueño la abrió él solo, no se dice nada (ya sabe que es suya). Sirve
     para legitimar: quien ve que la tarea se la encargó el jefe o el arquitecto,
     ya no cuestiona el gasto ni la iniciativa. Va aquí, en la ficha, para no
     ensuciar la pantalla. */
  if(t.creada_por && t.creada_por!==t.duenio && PERSONAS[t.creada_por])

  if(fichaOpen){

       '<div class="fbody on">'+(frows?'<dl>'+frows+'</dl>':'')+'</div>';
  } else {
    /* COLAPSADA por defecto: resumen de 2 renglones, un toque para ver todo */
    h+='<button class="strip col" id="bstrip"><span class="rsm2">'+esc(resumenTarea(t))+'</span>'+
       '<span class="scv">ver detalle ▾</span></button>';
  }

  /* Si esta tarea es MI REVISION de algo que ejecuta otro, aqui va el acceso
     directo a su tarea: ahi vive su evidencia. Salvador 2026-09-04. */
  if(t.revisa_a || t.revisa_ext){
    var org=t.revisa_a ? tareas.filter(function(x){return x.id===t.revisa_a})[0] : null;
    if(org){
      var qn2=PERSONAS[org.duenio]?PERSONAS[org.duenio].nombre:"";

         '<span class="s2">'+esc(org.nombre)+' · '+esc(estadoReal(org)==="cerrada"?"ya la cerró":"sigue abierta")+'</span></span>'+
         '<span class="ch2">›</span></button>';
    }else if(t.revisa_ext){
      h+='<button class="verorig"><span class="g2"><b>Lo hace '+esc(t.revisa_ext)+'</b>'+
         '<span class="s2">No está en la app · el seguimiento es tuyo</span></span></button>';
    }else{
      /* la tarea que revisabas ya no está: se dice, no se calla */
      h+='<button class="verorig"><span class="g2"><b>La tarea que revisabas ya no está</b>'+
         '<span class="s2">La borraron o se perdió · esta revisión quedó suelta</span></span></button>';
    }
  }

  var m="";
  (t.msgs||[]).forEach(function(x,ix){
    var q=autorMsg(x,t);
    if(x.hab){ m+=burbujaHablada(x, (q||""), t.id+"|"+ix); return; }
    var meta=(q?esc(q)+" · ":"")+esc(x.h);
    /* Salvador 2026-09-22: el ULTIMO mensaje mio trae un botecito 5 minutos,
       por si se subio mal y era otra cosa. Se borra sin preguntar. */
    var undo=(x.k==="bo" && ix===(t.msgs.length-1) && x.ts && (Date.now()-x.ts)<5*60000 && (!x.de||x.de===yo));
    m+='<div class="b '+(x.k==="bal"?"bal":(x.k==="bo"?"bo":"bi"))+'">'+esc(x.t)+'<span class="st">'+meta+
       (undo?'<button class="mdel" data-mdel="'+ix+'" aria-label="Borrar este mensaje">'+ico("trash",15,1.8)+'</button>':'')+
       '</span></div>';
  });
  if(t.puntos){

      var cam=p.foto?'<span class="cm'+(ft[i]?" ok":"")+'">FOTO'+(ft[i]?" ✓":"")+'</span>':'';

        '<span class="cv">'+(detOpen[i]?"▲":"▼")+'</span></button></div>'+
        (detOpen[i]?'<div class="dt">'+esc(p.d)+'</div>':'')+'</li>';
    }).join("");
    m+='<div class="chk'+(chkCerrado[t.id]?" cl":"")+'"><button class="ch" id="bchk">'+
       '<span class="tt">Rondín</span><span class="cn'+(n===t.puntos.length?" full":"")+'">'+n+' de '+t.puntos.length+'</span>'+

  /* Tarjeta de decisión: el jefe ve el resumen Y lo adjunto sin ir a buscarlo.
     Rediseño 2026-09-04 (opción C que escogió Salvador): franja naranja a la
     izquierda, descripción a la izquierda, adjuntos a la DERECHA alineados EXACTO
     con los del chat (el más reciente arriba). */
  if(t.estado==="espera"&&PERSONAS[yo].jefe){
    var ult=(t.msgs||[]).filter(function(x){return x.k==="bo"}).slice(-1)[0];
    var conc=[t.revisar,t.gasto].filter(function(v){return v&&String(v).trim()}).join(" · ");

      (adj.length>3?'<span class="mas">+'+(adj.length-3)+'</span>':'');
    m+='<div class="adj"><div class="dtxt">'+
         '<div class="hh">Esperan tu decisión</div>'+
         (conc?'<div class="dc">'+esc(conc)+'</div>':'')+
         '<div class="sub">'+esc(ult?ult.t:t.ultima||"")+'</div>'+

       '</div>'+
       (adj.length?'<div class="dtadj">'+tiras+'</div>':'')+
       '</div>';
  }

  /* ---- DOS BOTONES. NUNCA MÁS. ----
     El tercero se fue el 2026-09-02: "no vino", "no me ha contestado" no son
     información, son la ausencia de que pase algo — y eso ya lo mide el silencio.
     Un botón que significa "no pasó nada" enseña a apretar en vez de a hacer.
     Lo que traía ese botón entra por ESTOY ATORADO, que sí mueve la maquinaria. */
  var sug="";
  if(t.estado==="espera"&&PERSONAS[yo].jefe){
    /* SOLO DOS, mitad y mitad: autorizar, o "muy caro" (abre la pantalla con las
       opciones inteligentes — vNegociar). */
    sug='<button class="op k" data-jr="Autorizo">Autorizo</button>'+
        '<button class="op w" id="bcaro">Muy caro</button>';
  } else if(t.estado==="espera"){
    var qa=quienAutoriza(yo);
    sug='<button class="op" disabled>Esperando a '+esc(PERSONAS[qa.quien].nombre)+'</button>';
  } else if(!t.cierre && estadoReal(t)!=="cerrada" && t.duenio===yo){
    /* orden nuevo (Salvador 2026-09-18): relojito a la izq, "Ya está" a la derecha
       arriba del micrófono. Un recordatorio suelto no lleva "Estoy atorado". */
    var _est=_sal?"gris":estadoRelojito(t);
    var _rel='<button class="op alrm '+_est+'" id="brel" aria-label="Recordatorios">'+ico("bell",22,1.7)+'</button>';
    var _ya='<button class="op ya" id="bya"><svg class="icx" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg> Ya está</button>';
    /* bote de basura (Salvador 2026-09-22): mismo tamaño que la campana.
       En tarea abre el cierre honesto (motivo) que ya existia en el menu "...".
       En recordatorio suelto solo pide confirmar y lo borra, sin pedir motivo. */
    var _tr='<button class="op del" id="'+(t.es_recordatorio?"btrashrec":"btrash")+'" aria-label="Eliminar">'+ico("trash",22,1.7)+'</button>';
    if(t.es_recordatorio){
      sug=_rel+_ya+_tr;
    } else {
      /* Salvador 2026-09-22: mientras espera nombre+motivo (t.pide_atoro) el
         boton se apaga, para que no de la impresion de que aceptar de nuevo

  return h+'<div class="scroll"><div class="msgs">'+m+pre+'</div></div>'+
    /* LA MISMA BARRA DE TODAS LAS VISTAS — 2026-09-04. Antes el hilo tenia la
       camara a la IZQUIERDA y una flecha de enviar a la derecha, distinto de la
       caratula (camara a la DERECHA, sin flecha). Salvador lo cacho: "tiene que
       ser igual en todas". Ahora es identica: pill (campo + microfono) y la
       camara a la derecha. Se envia con Enter o dictando. */
    '<div class="comp">'+
      (sug?'<div class="sug">'+sug+'</div>':'')+

      '<div class="caja2">'+
        '<button class="mas" id="tcam" aria-label="Agregar foto">'+ico("mas",22,2)+'</button>'+

          'data-ph="'+(window.__avAdd===t.id?"Dicta o escribe el recordatorio":"")+'" enterkeyhint="send" '+
          'autocorrect="on" autocapitalize="sentences" spellcheck="true"></div>'+
        '<button class="env" id="tenv" aria-label="Enviar">'+ico("sube",21,2.2)+'</button>'+
        '<button class="mic" id="tmic" aria-label="Dictar">'+ico("mic",26,1.7)+'</button>'+
      '</div>'+
    '</div></div>'+
    (window.__avSheet===t.id?vAvisosSheet(t):"");
}

     BUSCAR     -> filtra la lista con los terminos que Claude entendio
     CREAR      -> abre tarea, PERO antes pasa por el filtro de repetidas
     ENCARGAR   -> solo si YA era tarea suya y pasa la ejecucion. No abre tarea nueva.
     RESPONDER  -> contesta con lo que hay. No inventa: si no esta, lo dice.

   en el toast que fue busqueda local, para que nadie crea que Claude respondio. */

/* EL FOLDER COMPLETO DE UNA TAREA — 2026-09-03.
   Esto es lo que le pasamos a Claude SOLO de las tareas relevantes a lo que
   dictaste (nunca de las 120: eso quemaria tokens). Con esto Claude puede:
     - NARRAR el avance fino: en que paso va, que dice la ultima nota, si esta
       detenido y desde cuando, si va a fallar.
     - LIGAR un paso dictado a la tarea correcta.
   NO inventa: solo cuenta lo que hay en este folder. */
function detalleTarea(t, ancho){
  var d={
    id:t.id, nombre:t.nombre,
    de:(PERSONAS[t.duenio]&&PERSONAS[t.duenio].nombre)||t.duenio||"",
    estado:estadoReal(t),
    criticidad:t.criticidad||"normal",
    recuperable:t.recuperable!==false,
    cada:t.periodicidad||"unica",
    nacio:t.f_original||"", vence:t.f_vigente||"", veces_movida:t.movidas||0,
    se_cierra_con:t.cierra||"", asunto:t.revisar||"", gasto:t.gasto||""
  };
  if(t.pasos && t.pasos.length){
    d.pasos=t.pasos.map(function(p,i){
      return {n:i+1, que:p.t, dia:p.dia, es_donde_va:(i===(t.paso||0))};
    });
    var r=ritmo(t);
    if(r) d.ritmo={paso_actual:r.paso, dias_atrasado:r.atraso, va_a_fallar:!!r.va_a_fallar};
  }
  if(t.detenido){
    d.detenido={espera_a:t.detenido.quien, que_espera:t.detenido.que,
                dias_detenido:diasDetenido(t)};
  }
  if(t.encargado && PERSONAS[t.encargado.a])
    d.delegado_a=PERSONAS[t.encargado.a].nombre;
  /* Las notas del hilo: de ahi sale "ya localizo al electrico". Para una
     CONSULTA se manda TODO el hilo (ahi vive el dato que preguntan: la
     direccion del hotel, el monto del presupuesto), no solo las ultimas.
     Salvador 2026-09-04. */
  if(t.msgs && t.msgs.length)
    d.notas=(ancho ? t.msgs.slice(-25) : t.msgs.slice(-4)).map(function(m){return m.t});
  /* Los DOCUMENTOS que trae pegados, por nombre y fecha: asi Claude puede decir
     "el ultimo presupuesto que subio" y señalar cual es. */
  if(ancho){
    var ad=adjuntos(t);
    if(ad.length) d.documentos=ad.slice(-8).map(function(e,i){
      var o={n:i+1, que:e.de||"documento", cuando:fechaCorta(e.ts)};
      if(e.leido) o.dice=e.leido;     /* lo que se leyó de la imagen */
      return o;
    });
  }
  if(t.cierre) d.cerrada={como:t.cierre.tipo, cuando:t.cierre.f};
  return d;
}

function contextoBarra(){
  var abiertas=tareas.filter(function(t){ return !t.cierre })
    .slice(0,120)
    .map(function(t){
      return {id:t.id, nombre:t.nombre, de:t.duenio||"", estado:estadoReal(t),
              fecha:t.f_vigente||"", cada:t.periodicidad||"unica",
              ultima:t.ultima||""};
    });
  /* Salvador 2026-09-22: las cerradas ya no se pintan en el home, asi que
     "que hice / termine / elimine hoy" se contesta de aqui. Ultimos 7 dias. */
  var cerradas=tareas.filter(function(t){ return t.cierre && t.cierre.f && dDif(t.cierre.f,hoy())<=7 })
    .sort(function(a,b){ return String(b.cierre.f).localeCompare(String(a.cierre.f)); })
    .slice(0,60)
    .map(function(t){
      return {id:t.id, nombre:t.nombre, de:t.duenio||"", cerrada_el:t.cierre.f,
              como:(t.cierre.tipo==="hecha"?"hecha":(t.cierre.tipo==="cancelado"?"eliminada":"cerrada sin hacerse")),
              es_recordatorio:!!t.es_recordatorio};
    });
  return {yo:yo, soy_jefe:!!(PERSONAS[yo]&&PERSONAS[yo].jefe), hoy:hoy(),
          hoy_es:DIAS_SEM[new Date().getDay()],
          calendario:calendarioProximo(16),
          cerradas_recientes:cerradas,
          gente:Object.keys(PERSONAS).map(function(k){
            return {clave:k, nombre:PERSONAS[k].nombre};
          }),
          abiertas:abiertas};
}

"AVISAR (recordatorio). Si dudas, PREGUNTA '¿es algo que hay que hacer, o solo "+
"quieres que te lo recuerde?'.\n"+

"abierta en el contexto), no una tarea nueva ni un encargo suelto. Ej: si ya existe "+
"'conseguir la reja' y dicen 'que Samuel le hable al proveedor', eso es un PASO de esa "+
"tarea. Ligalo a esa tarea. El tiempo del paso es CORTO (lo que tarda esa gestion), NO "+
"el vencimiento final de la tarea. Si no ves la tarea a la que pertenece, NO es paso: "+
"es CREAR o ENCARGAR. Si dudas si es paso o algo aparte, PREGUNTA. Pon en 'paso' los "+
