<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#111114">
<title>Doit</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Doit">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* TEMA OSCURO PREMIUM — paleta aprobada por Salvador el 2026-09-02.
   v1 SALE OSCURA SIEMPRE. El modo claro (seguir el tema del teléfono) quedó
   propuesto pero NO confirmado: no se implementa sin su sí. */
:root{
  --ground:#111114;--surface:#1D1D21;--surface-2:#26262B;--line:#26262B;
  --ink:#F5F5F7;--ink-2:#98989E;--ink-3:#7A7A80;--ink-4:#636368;
  --hacer:#30D158;--super:#98989E;--esper:#FF9F0A;--venc:#FF453A;--sil:#FF453A;
  --bin:#1D1D21;--bout:#14301F;
  /* Salvador 2026-09-22: colores de las 7 franjas de seccion del home */
  --amar:#FFD60A;--azul:#0A84FF;--morado:#7C64FF;--naranjaosc:#D2660A;--gris-b:#8E8E93;
  /* la banda roja del encabezado */
  --rojo-bg:#2B0E0C;--rojo-ctl:#3B1210;--rojo-ink:#FF6961;--rojo-ink2:#D89795;
  --rojo-icon:#A05A55;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* NADA SE SALE DE LADO. Al abrirse el teclado, iOS encogia el ancho util y el
   encabezado se recorria: se perdian la camara y el engrane, y no regresaban
   hasta cerrar la app. Con esto el ancho queda clavado y no hay scroll lateral. */
html,body{height:100%;max-width:100%;overflow-x:hidden;position:relative}
@supports(height:100dvh){html,body{height:100dvh}}
.enc,.r1,.r2{max-width:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:Barlow,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overscroll-behavior:none}
button{font:inherit;color:inherit}

/* ---------- pantalla de entrada ---------- */
#gate{position:fixed;inset:0;background:var(--ground);z-index:50;display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:28px;gap:22px;overflow:hidden}
#gate.on{display:flex}
/* el resplandor suave detras del logo, con los colores de la marca */
#gate::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;
  left:50%;top:50%;transform:translate(-50%,-68%);pointer-events:none;
  background:radial-gradient(closest-side,rgba(124,100,255,.22),rgba(233,64,168,.08) 55%,transparent 75%)}
#gate>*{position:relative}
#gate h1{font-family:Archivo;font-size:29.7px;margin:0;text-align:center}
#gate .logo{width:128px;height:128px;border-radius:32px;margin-bottom:2px;
  box-shadow:0 18px 44px rgba(0,0,0,.55),0 2px 10px rgba(0,0,0,.4)}
#gate p{color:var(--ink-2);font-size:19.6px;text-align:center;max-width:32ch;line-height:1.5;margin:0}
@keyframes gsube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#gzona,#gate .logo{animation:gsube .45s ease-out both}
#gzona{animation-delay:.12s}
@media (prefers-reduced-motion:reduce){#gzona,#gate .logo{animation:none}}
.nip{display:flex;gap:9px}
.nip input{width:52px;height:60px;text-align:center;font-size:35.1px;font-family:Archivo;
  border:1.5px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink)}
.nip input:focus{outline:2px solid var(--hacer);border-color:var(--hacer)}
.gerr{color:var(--venc);font-size:18.2px;min-height:18px}
/* build 72: boton de Google, tarjeta y apagador del paso de avisos */
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:16px 34px;
  border-radius:999px;border:0;background:#fff;color:#1d1d1f;
  font-family:Barlow,sans-serif;font-size:19.6px;font-weight:600;cursor:pointer;
  box-shadow:0 10px 28px rgba(0,0,0,.42),0 1px 0 rgba(255,255,255,.14) inset;
  transition:transform .15s ease,box-shadow .15s ease}
.gbtn:active{transform:scale(.97);box-shadow:0 5px 16px rgba(0,0,0,.4)}
.gbtn[disabled]{opacity:.6}
.gcol{display:flex;flex-direction:column;gap:16px;width:min(340px,88vw);align-items:stretch}
.gcard{display:flex;align-items:center;gap:13px;background:rgba(255,255,255,.055);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.10);border-radius:22px;padding:17px 17px;
  width:100%;text-align:left;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.gcx{flex:1 1 auto;min-width:0}
.gico{width:42px;height:42px;border-radius:13px;flex:0 0 auto;display:flex;
  align-items:center;justify-content:center;background:linear-gradient(135deg,#3ddc6a,#22a447);
  box-shadow:0 4px 12px rgba(48,209,88,.25)}
.gico svg{width:24px;height:24px}
.gbtn.wide{width:100%}
.gcard .tt{font-size:18.9px;font-weight:600}
.gcard .dd{color:var(--ink-2);font-size:15.4px;line-height:1.4;margin-top:2px}
.gsw{position:relative;width:56px;height:32px;border-radius:16px;background:var(--hacer);
  transition:background .2s;flex:0 0 auto;cursor:pointer}
.gsw.off{background:var(--line)}
.gsw i{position:absolute;top:3px;left:27px;width:26px;height:26px;border-radius:50%;
  background:#fff;transition:left .2s}
.gsw.off i{left:3px}
#gzona{display:flex;flex-direction:column;align-items:center;gap:14px}

/* ---------- barra ---------- */
.top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 11px) 15px 11px;
  background:var(--surface);border-bottom:.5px solid var(--line);flex:none}

/* ---------- ENCABEZADO FIJO DE LA CARATULA — dos renglones, no scrollea ----------
   Renglon 1: nombre · estado · engrane.  Renglon 2: barra unica · camara.
   Todo lo demas (desde "Hoy") scrollea por debajo. */
.enc{flex:none;background:var(--surface);border-bottom:.5px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 15px 10px;
  transition:background .35s ease}
.enc .r1{display:flex;align-items:center;gap:9px}
.enc .nom{font-family:Archivo;font-size:27px;font-weight:500;color:var(--ink);line-height:1.15}
.enc .grow{flex:1}
.enc .eng{width:40px;height:40px;border-radius:50%;border:0;background:transparent;
  display:grid;place-items:center;color:var(--ink-2);cursor:pointer;flex:none;padding:0}
/* los SVG de trazo se alinean solos y heredan el color: un solo peso en toda la app */
.icx{display:block;flex:none}
.encq .icx{display:inline-block;vertical-align:-2px;margin-left:2px}
/* VERDE: que ni se note es el premio. Sin fondo, sin borde. */
.est{display:flex;align-items:center;gap:6px;font-size:16.2px;color:var(--ink-2)}
.est .pt{width:7px;height:7px;border-radius:50%;background:var(--hacer);flex:none}
/* ROJO: tine TODO el encabezado y RESPIRA. Nunca parpadeo duro. */
.enc.rojo{background:var(--rojo-bg)}
.enc.rojo .nom{color:var(--ink)}
.enc.rojo .est{color:var(--rojo-ink2)}
.enc.rojo .est .pt{background:var(--rojo-ink);animation:resp 1.8s ease-in-out infinite}
.enc.rojo .eng{color:var(--rojo-icon)}
.enc.rojo .barra{background:var(--rojo-ctl);border-color:transparent}
.enc.rojo .barra input{color:var(--ink)}
.enc.rojo .barra .lupa,.enc.rojo .barra .mic{color:var(--rojo-icon)}
.enc.rojo .cam{background:var(--rojo-ctl);color:var(--rojo-icon)}
@keyframes resp{0%,100%{opacity:1}50%{opacity:.42}}
@media (prefers-reduced-motion:reduce){.enc.rojo .est .pt{animation:none}}
/* el renglon de abajo del encabezado rojo: quien te espera */
.encq{display:block;width:100%;text-align:center;background:none;border:0;margin-top:9px;
  color:var(--rojo-ink);font-size:16.9px;cursor:pointer;padding:2px 0 0;
  animation:resp 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.encq{animation:none}}

/* ---------- BARRA UNICA: crea, busca o revisa ----------
   VIVE ABAJO, como WhatsApp y Telegram: al abrirse el teclado sube pegada a el
   y nunca la pierdes de vista. Arriba obligaba a mirar abajo para teclear y
   arriba para leer lo que escribiste. Pedido por Salvador el 2026-09-02. */
.pie{flex:none;display:flex;align-items:center;gap:8px;background:var(--surface);
  border-top:.5px solid var(--line);padding:8px 15px max(8px,calc(env(safe-area-inset-bottom) - 10px))}
.r2{display:flex;align-items:center;gap:8px}
.barra{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--surface-2);
  border:.5px solid var(--line);border-radius:12px;padding:0 4px 0 9px;height:46px}
/* ===== LA CAJA DE ESCRIBIR, UN SOLO RENGLON COMO WHATSAPP — Salvador 2026-09-23 =====
   El "+" a la izquierda, el texto en medio (crece hasta 4 renglones y de ahi se
   recorre) y el microfono / la flecha a la derecha, TODO en la misma fila. Antes
   era en dos pisos (texto arriba, botones abajo) y el cursor salia encimado
   sobre el "+". Los botones se pegan al borde de abajo (align-items:flex-end)
   para que al crecer el texto queden junto al ultimo renglon, como WhatsApp. */
.caja2{flex:1;min-width:0;display:flex;flex-direction:row;align-items:flex-end;gap:6px;
  background:var(--surface-2);border:.5px solid var(--line);border-radius:24px;
  padding:5px 6px}
/* 18.9px de letra por 1.35 de interlinea = 25.5px el renglon; 4 renglones = 102 + padding */
.caja2 .caja{flex:1;min-width:0;max-height:112px;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:5px 4px;min-height:36px;display:flex;flex-direction:column;justify-content:center}
/* Los tres botones miden lo mismo y se definen AQUI COMPLETOS (sin esto el
   microfono heredaba el estilo de boton del navegador y salia un cuadro blanco). */
.caja2>button{width:36px;height:36px;flex:none;border-radius:50%;
  display:grid;place-items:center;padding:0;cursor:pointer;
  -webkit-appearance:none;appearance:none}
.caja2 .mas{background:var(--surface);border:.5px solid var(--line);color:var(--ink-2)}
.caja2 .mas:active{background:var(--line)}
.caja2 .mic{background:var(--hacer);border:0;color:#06340f}
.caja2 .mic.oyendo{background:var(--hacer);border:0;color:#06340f;box-shadow:0 0 16px rgba(48,209,88,.5);animation:resp 1.1s ease-in-out infinite}
.caja2 .env{background:var(--surface-2);border:.5px solid #34343a;
  color:var(--ink-3);transition:background .18s ease,color .18s ease,box-shadow .18s ease}
.caja2 .env{display:none}                 /* WhatsApp: la flecha solo con texto */
.caja2 .env.listo{display:grid;background:var(--hacer);border:0;color:#06340f;box-shadow:0 0 14px rgba(48,209,88,.45)}
.caja2 .mic.oculto{display:none}          /* y el micro se esconde al escribir */
.caja2 .env:active{filter:brightness(.9)}
/* CUANDO QUEDA TEXTO SIN MANDAR, LA FLECHA LLAMA. Salvador 2026-09-05: la
   palomita de la franja gris de iOS parece de enviar, pero solo cierra el
   teclado — no manda nada. En cuanto se cierra el teclado con texto escrito, la
   flecha verde de la app se pone a latir. Se apaga sola al mandar o al volver a escribir. */
.caja2 .env.pendiente{animation:llama 1.25s ease-in-out infinite}
@keyframes llama{
  0%,100%{box-shadow:0 0 0 0 rgba(48,209,88,0); transform:scale(1)}
  50%{box-shadow:0 0 0 7px rgba(48,209,88,.22); transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.caja2 .env.pendiente{animation:none;
  box-shadow:0 0 0 5px rgba(48,209,88,.22)}}
@media (prefers-reduced-motion:reduce){.caja2 .mic.oyendo{animation:none}}
/* el microfono crece y gana area de toque SIN crecer la barra: el boton mide
   36px pero la barra sigue en 46 de alto. Y queda separado del borde, como la lupa. */
.barra .lupa{color:var(--ink-3);flex:none;display:grid;place-items:center}
.barra .mic{color:var(--ink-3);flex:none;background:none;border:0;cursor:pointer;
  display:grid;place-items:center;width:34px;height:34px;padding:0}
/* mientras dicta: el microfono se pone rojo y late. Se ve desde lejos. */
.barra .mic.oyendo{color:var(--venc);animation:resp 1.1s ease-in-out infinite}
.ic.oyendo{color:var(--venc);animation:resp 1.1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.barra .mic.oyendo{animation:none}}
.barra input{flex:1;background:none;border:0;outline:0;font:inherit;font-size:18.9px;
  color:var(--ink);min-width:0}
/* ===== LA CAJA DE ESCRIBIR ES contenteditable, NO un <input> =====
   Salvador, 2026-09-04. Dos cosas de un solo golpe:
   1) el AUTOCORRECTOR del teclado prende (antes iba autocorrect="off" y
      spellcheck="false", por eso nunca corregia nada);
   2) en iPhone DESAPARECE la franja gris con las flechitas < > y "Listo"
      que Safari le cuelga arriba del teclado a los <input> y <textarea>.
      Esa barra NO se puede quitar con CSS ni con JS: la unica forma es no
      usar un control de formulario. Con contenteditable, arriba del teclado
      queda SOLO la barra de sugerencias de autocorreccion — igual que en
      la app de Claude, que es lo que pidio.
   Se ve y se comporta igual que antes: valDe/ponVal le ponen un .value
   falso para que ningun otro pedazo del codigo tuviera que cambiar. */
/* OJO CON EL SELECTOR: la caja ya NO vive dentro de .barra sino de .caja2,
   asi que esta regla va a secas. Cuando estaba como ".barra .caja" dejo de
   aplicar al cambiar la barra a dos pisos y se veia el marco negro de foco
   del navegador. 2026-09-04. */
.caja{flex:1;min-width:0;background:none;border:0;outline:0;font:inherit;
  font-size:18.9px;color:var(--ink);line-height:1.35;
  white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.caja:focus,.caja:focus-visible{outline:0;box-shadow:none}
.caja.vacia:before{content:attr(data-ph);color:var(--ink-3);font-size:17.4px;
  pointer-events:none}
/* el texto que TU escribes va al tamano grande; solo la pista de adentro va un
   punto mas chica, para que 'Crea, busca o revisa' quepa completa. */
.barra input::placeholder,.barra textarea::placeholder{color:var(--ink-3);font-size:17.4px}
/* la barra del hilo es la misma, pero crece de alto cuando el texto dictado
   pasa de un renglon. El microfono se queda abajo, pegado a la ultima linea. */
.barra.hilo{height:auto;min-height:46px;align-items:flex-end;padding:5px 4px 5px 9px}
.barra textarea{flex:1;min-width:0;background:none;border:0;outline:0;resize:none;
  font:inherit;font-size:18.9px;color:var(--ink);line-height:1.35;
  max-height:96px;padding:8px 0;margin:0}
.cam{width:44px;height:44px;border-radius:50%;flex:none;background:var(--surface-2);
  border:.5px solid var(--line);display:grid;place-items:center;padding:0;
  color:var(--ink-2);cursor:pointer}
.who{width:38px;height:38px;border-radius:50%;flex:none;background:var(--hacer);color:#fff;
  display:grid;place-items:center;font-family:Archivo;font-weight:600;font-size:17.6px}
.top .t{font-family:Archivo;font-weight:600;font-size:20.9px;line-height:1.15}
.top .d{font-size:16.9px;color:var(--ink-2);line-height:1.3}
.top .grow{flex:1}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);
  display:grid;place-items:center;font-size:20.2px;cursor:pointer;flex:none;position:relative}
.iconbtn .cnt{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;
  border-radius:9px;background:var(--hacer);color:#fff;font-family:Archivo;font-weight:600;
  font-size:13.5px;display:grid;place-items:center;border:1.5px solid var(--surface)}

/* ---------- lista ---------- */
#app{position:relative}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:10px 1fr auto;gap:11px;align-items:start;width:100%;
  text-align:left;background:none;border:0;border-bottom:.5px solid var(--line);padding:13px 15px;cursor:pointer}
/* DOS RENGLONES EXACTOS, siempre con puntitos. Nunca segunda linea: "todo parejo".
   El texto completo esta al abrir la tarea. */
.row>span:nth-child(2){min-width:0}
.row .nm,.row .ls,.row .paso{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;min-width:0}
.row .nm{font-size:19.6px;color:var(--ink)}
.row .ls{font-size:15.5px;color:var(--ink-2);font-weight:400}
.row .paso{font-size:15.5px}
/* el encabezado de la lista: Hoy + fecha larga */
.hoyh{display:flex;align-items:baseline;gap:8px;padding:16px 15px 6px}
.hoyh b{font-family:Archivo;font-size:23px;font-weight:600;color:var(--ink)}
.hoyh span{font-size:16.9px;color:var(--ink-3)}
/* pie tenue: lo que Claude persigue y no subio */
.piesig{display:block;width:100%;text-align:center;background:none;border:0;
  padding:16px 15px 26px;color:var(--ink-4);font-size:16.2px;cursor:pointer}
.row:active{background:var(--surface-2)}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px}
.rico{display:flex;align-items:flex-start;margin-top:1px;color:var(--morado)}/* Salvador 2026-09-22: color de su seccion */
.rico .icx{opacity:.8}
.d-hacer{background:var(--hacer)}.d-super{background:var(--super)}
.d-esper{background:var(--esper)}.d-sil{background:var(--sil)}.d-ok{background:var(--ink-3)}
.d-venc{background:var(--venc)}
/* puntitos del color de su seccion en el home (Salvador 2026-09-22) */
.d-sec-atora{background:var(--venc)}.d-sec-pend{background:var(--naranjaosc)}
.d-sec-venc{background:var(--amar)}.d-sec-msg{background:var(--hacer)}
.d-sec-hoy{background:var(--azul)}.d-sec-rec{background:var(--morado)}.d-sec-prox{background:var(--gris-b)}
.d-tenue{background:var(--super);opacity:.42}
.buscar{padding:8px 14px 4px}
.binp{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;font:inherit;font-size:18.9px;color:var(--ink)}
.binp::placeholder{color:var(--ink-3)}
.franja{display:flex;flex-direction:column;gap:2px;align-items:flex-start;width:100%;text-align:left;
  margin:8px 14px 4px;width:calc(100% - 28px);border-radius:11px;padding:11px 13px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface)}
.franja b{font-family:Archivo;font-size:18.9px;font-weight:600}
.franja span{font-size:16.9px;color:var(--ink-2)}
.franja.bien{border-color:var(--hacer);background:color-mix(in srgb,var(--hacer) 9%,transparent)}
.franja.bien b{color:var(--hacer)}
.franja.mal{border-color:var(--venc);background:color-mix(in srgb,var(--venc) 11%,transparent)}
.franja.mal b{color:var(--venc);animation:lat 1.6s ease-in-out infinite}
@keyframes lat{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.franja.mal b{animation:none}}
.alerta{color:var(--venc);font-weight:600}
.nota{margin:10px 14px 0;padding:10px 12px;border-radius:9px;background:var(--surface-2);
  color:var(--ink-2);font-size:16.9px;line-height:1.45}
.grp{font-family:Archivo;font-size:14.9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);padding:14px 15px 6px}
.sec-head{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;
  margin:0;padding:14px 15px 6px;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent;
  font:inherit;color:inherit}
.sec-head .grp{padding:0}
.sec-chev{width:8px;height:8px;border-right:1.6px solid var(--ink-3);border-bottom:1.6px solid var(--ink-3);
  transform:rotate(-45deg);transition:transform .2s ease;flex:none}
.sec-chev.open{transform:rotate(45deg)}
/* ===== BARRAS DE SECCION UNIFORMES — mismo molde, un color por seccion.
   Aprobado por Salvador 2026-09-22: acordeon (solo una abierta a la vez),
   contenido siempre blanco/gris (nunca texto de color), puntito/icono lateral
   del color de su seccion. Reemplaza los .sec-head planos de venc/hoy/rec/prox
   y unifica con el molde que ya traian .msgbar/.pendbar. ===== */
.sbar{display:flex;align-items:center;gap:12px;width:calc(100% - 30px);margin:11px 15px 3px;
  padding:9px 13px;border-radius:12px;cursor:pointer;text-align:left;border:1px solid transparent;
  background:none;font:inherit;color:inherit}
.sbar .sicw{position:relative;flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center}

   el teclado, iOS empujaba todo y los mensajes se salian por arriba.

   mide toda la pantalla y los globos caen al fondo; cuando la conversacion

/* dos botones = MITAD Y MITAD (Salvador 2026-09-04): flex-basis 0 iguala el ancho

   cerrar con "Ya esta" o eliminar, la app NO cambia de tarea. Sello de palomita
   + vibracion; campana gris y chat vacio mientras dura el cintillo "... ·
   Deshacer" (5 s); al cerrar, el titulo parpadea dos veces en verde y queda
   tachado. Cambiar de tarea es siempre con el dedo (swipe), nunca solo.
   Supera la regla del 22-sep de "eliminar recordatorio salta al siguiente". */
.salto-stamp{position:fixed;inset:0;display:grid;place-items:center;z-index:60;pointer-events:none}

@keyframes saltoPop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}

@keyframes saltoPill{from{transform:translateY(140%);opacity:0}to{transform:translateY(0);opacity:1}}

.undopill{position:fixed;left:50%;transform:translateX(-50%);z-index:61;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);background:var(--surface-2);border:.5px solid var(--line);border-radius:999px;padding:7px 8px 7px 14px;font-size:14px;color:var(--ink-2);box-shadow:0 6px 20px rgba(0,0,0,.35);animation:undoIn .25s cubic-bezier(.2,.8,.2,1);transition:opacity .25s ease}

/* URGENTE — lo que TÚ detienes ya no vive en una franja aparte: son las PRIMERAS
   tareas de la lista. En lugar del puntito va un RELOJ dentro de una pastilla
   naranja (Salvador 2026-09-04: el reloj en vez de la palabra, para que ocupe
   menos espacio y le quede más renglón al título). El reloj NO se mueve ni
   cambia de tamaño; lo que late es el fondo naranja, subiendo y bajando la
   intensidad — así se nota sin marear. La FILA va con el mismo fondo que todas
   las demás: sin tinte naranja, se ve más limpia (Salvador 2026-09-04). */
/* El reloj se alinea con el RENGLÓN PRINCIPAL (el título), igual que los
   puntitos de colores de las demás filas — no centrado entre los dos renglones
   (Salvador 2026-09-04: que no se vea desordenado). El título mide 19.6px con
   line-height 1.25 = 24.5px; el reloj mide 30px, así que sube 3px para que su
   centro caiga en el centro de esa primera línea. */
/* ALINEACIÓN EXACTA (Salvador 2026-09-04): el tope del reloj coincide con el
   tope de las letras del título, y la base de "URGE" con la base del segundo
   renglón. El título mide 19.6px con interlínea 1.25 (24.5px) y el subtítulo
   15.5px con 1.35 (20.9px), más 2px entre ellos: el bloque de texto va de ~5.5px
   (donde empiezan las letras) a ~44.7px. El conjunto reloj+palabra mide 40.5px
   y arranca en 5px, así que cierra pareja arriba y abajo. */
.row.urg{grid-template-columns:44px 1fr auto;align-items:start}
.utag{width:44px;margin-top:1px;display:flex;flex-direction:column;align-items:center;gap:3px}
.utag .ur{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  color:#FFC26B;animation:brillo 1.9s ease-in-out infinite}
.utag .uw{font-family:Archivo;font-weight:700;font-size:11px;letter-spacing:.08em;
  color:#FFC26B;text-transform:uppercase;line-height:1}
@keyframes brillo{
  0%,100%{background-color:rgba(255,159,10,.10);box-shadow:0 0 0 rgba(255,159,10,0)}
  50%{background-color:rgba(255,159,10,.42);box-shadow:0 0 14px rgba(255,159,10,.32)}}
@media (prefers-reduced-motion:reduce){.utag{animation:none;background-color:rgba(255,159,10,.30)}}
/* CAPA DE DICTADO — Salvador 2026-09-04, calcada del dictado de Claude:
   NO es pantalla completa. Es un panel abajo, donde estaba la barra. El texto
   va apareciendo arriba y crece hasta CUATRO renglones; de ahí en adelante se
   recorre solo hacia arriba, para que siempre veas el último renglón que
   acabas de dictar y no pierdas el hilo. Debajo, la tacha a la izquierda, las
   barras de audio moviéndose en medio, y la palomita a la derecha. */
/* MISMO ALTO Y LUGAR QUE LA BARRA DE ESCRIBIR: mismos paddings, mismo fondo,
   botones del mismo tamaño (36px). Solo cambia el contenido: basura, tiempo,
   onditas y avioncito. No crece ni empuja nada. Salvador 2026-09-17. */
.dictacapa{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--surface);
  border-top:.5px solid var(--line);
  padding:8px 15px max(8px,calc(env(safe-area-inset-bottom) - 10px))}
.dfila{display:flex;align-items:center;gap:10px;background:var(--surface-2);
  border:.5px solid var(--line);border-radius:22px;padding:5px 6px}
.dx,.dok{width:36px;height:36px;flex:none;border:0;border-radius:50%;display:grid;
  place-items:center;cursor:pointer;-webkit-appearance:none}
.dx{background:transparent;color:var(--venc)}                                    /* basura */
.dok{background:var(--hacer);color:#06340f;box-shadow:0 0 12px rgba(48,209,88,.4)}/* avioncito */
.dtime{font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;min-width:32px;flex:none;text-align:center}
.dbars{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;
  gap:3px;height:36px;overflow:hidden}
.dbars i{display:block;width:3px;height:8px;border-radius:2px;background:var(--ink);
  animation:onda .7s ease-in-out infinite;opacity:.28;filter:grayscale(1)}
.dictacapa.vivo .dbars i{opacity:1;filter:none}
@keyframes onda{0%,100%{height:5px;opacity:.45}50%{height:24px;opacity:1}}
@media (prefers-reduced-motion:reduce){.dbars i{animation:none;height:18px}}

function disparaPushInstantaneo(para, titulo, cuerpo, url) {
  if (!para || para === yo) return; // No auto-notificar si la acción la hace uno mismo
  
  fetch('/push.php?action=send', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-app-token': APP_TOKEN
    },
    body: JSON.stringify({
      usuario: para,
      title: titulo || 'Doit',
      body: cuerpo || 'Tienes una nueva notificación',
      url: url || ''
    })
  }).then(function(r){ return r.json(); })
    .then(function(res){
      console.log('Push instantáneo enviado a ' + para + ':', res);
    }).catch(function(err){
      console.error('Error al disparar push:', err);
    });
}

/* la clave publica viaja como bytes al navegador */
function vapidBytes(base64){
  var pad="=".repeat((4-base64.length%4)%4);
  var b64=(base64+pad).replace(/-/g,"+").replace(/_/g,"/");
  var raw=atob(b64), arr=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
  return arr;
}

/* ¿se puede tener avisos en este telefono AHORA MISMO? Se dice el porque,
   no un "no" pelon: en iPhone Apple EXIGE que la app este agregada a la
   pantalla de inicio; si no, ni se intenta. */
function estadoAvisos(){
  if(!("serviceWorker" in navigator) || !("PushManager" in window))
    return {ok:false, motivo:"Este navegador no maneja avisos."};
  var iOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(iOS && !estaInstalada())
    return {ok:false, motivo:"En iPhone, primero agrega la app a tu pantalla de inicio (Compartir → Agregar a inicio). Los avisos solo funcionan desde ahí."};
  if(Notification.permission==="denied")
    return {ok:false, motivo:"Bloqueaste los avisos. Actívalos en Ajustes → la app."};
  return {ok:true, ya:(Notification.permission==="granted")};
}

/* pedir permiso + suscribir + mandar la suscripcion a push.php.
   TIENE QUE SALIR DE UN TOQUE del usuario: iOS no deja pedir permiso solo. */
function activaAvisos(cb){
  var e=estadoAvisos();
  if(!e.ok){ cb(false,e.motivo); return }
  Notification.requestPermission().then(function(p){
    if(p!=="granted"){ cb(false,"No diste permiso de avisos."); return }
    navigator.serviceWorker.ready.then(function(reg){
      return reg.pushManager.getSubscription().then(function(sub){
        if(sub) return sub;
        return reg.pushManager.subscribe({
          userVisibleOnly:true,
          applicationServerKey:vapidBytes(VAPID_PUBLIC)
        });
      });
    }).then(function(sub){
      var j=sub.toJSON();
      /* EL TOKEN VA AQUI TAMBIEN. Sin el, push.php contesta 401 y la
         suscripcion nunca quedaba: el telefono se suscribia con el navegador
         pero el servidor jamas la guardaba, asi que los avisos no podian
         llegarle a nadie. Encontrado probando en vivo el 2026-09-04. */
      return fetch(PUSH,{
        method:"POST",
        headers:{"content-type":"application/json","x-app-token":APP_TOKEN},
        body:JSON.stringify({
          usuario:yo||"anonimo",
          subscription:{endpoint:j.endpoint, keys:j.keys}
        })
      });
    }).then(function(r){
      if(r && r.ok) cb(true,"Listo: los avisos llegan a este teléfono.");
      else cb(false,"El teléfono quedó suscrito, pero el servidor no confirmó. Falta instalar push.php.");
    }).catch(function(){
      cb(false,"No se pudo activar. Revisa la señal e inténtalo otra vez.");
    });
  }).catch(function(){ cb(false,"No se pudo pedir el permiso."); });
}

/* RESINCRONIZAR SIN PREGUNTAR (Salvador 2026-09-22). Al borrar y reinstalar la
   app, el iPhone conserva el permiso pero el servidor pierde la suscripcion:
   push.php contestaba "No se encontro suscripcion push para el usuario". Como
   el permiso ya esta dado, aqui NO se pide (no hace falta toque): solo se toma
   la suscripcion del navegador (o se crea) y se vuelve a mandar al servidor.
   Corre al arrancar y cada vez que se pica el boton de avisos. */
function resincronizaAvisos(cb){
  cb=cb||function(){};
  try{
    if(!("serviceWorker" in navigator) || !("PushManager" in window) || Notification.permission!=="granted"){ cb(false); return; }
    navigator.serviceWorker.ready.then(function(reg){
      return reg.pushManager.getSubscription().then(function(sub){
        if(sub) return sub;
        return reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:vapidBytes(VAPID_PUBLIC)});
      });
    }).then(function(sub){
      var j=sub.toJSON();
      return fetch(PUSH,{method:"POST",
        headers:{"content-type":"application/json","x-app-token":APP_TOKEN},
        body:JSON.stringify({usuario:yo||"anonimo", subscription:{endpoint:j.endpoint, keys:j.keys}})});
    }).then(function(r){ cb(!!(r&&r.ok)); }).catch(function(){ cb(false); });
  }catch(e){ cb(false); }
}

/* Pregunta al Claude de la app. modelo: "rapido" o "pesado".
   cb(textoRespuesta, error) */
function preguntaAClaude(mensajes, modelo, cb){
  if(APP_TOKEN.indexOf("__")===0){ cb(null,"La app todavia no esta publicada en el servidor."); return }
  var planos=[];
  mensajes.forEach(function(m){
    if(typeof m.content==="string" && m.content.length>18000){
      for(var i=0;i<m.content.length;i+=18000)
        planos.push({role:m.role, content:m.content.slice(i,i+18000)});
    } else planos.push(m);
  });
  function tira(intento){
    /* Candado de tiempo — Salvador 2026-09-23: sin esto, si el proxy se
       quedaba pensando (servidor saturado, sin red de vuelta), el fetch
       jamas contestaba ni fallaba y la pantalla se quedaba trabada para
       siempre en "Leyendo lo que dijiste...". Ahora, si no hay respuesta en
       25s, se corta solo y cae al intento/aviso de siempre. */
    var ctrl = (typeof AbortController!=="undefined") ? new AbortController() : null;
    var vencio = false;
    var tOut = ctrl ? setTimeout(function(){ vencio=true; ctrl.abort(); }, 25000) : null;
    /* si Claude YA contesto y lo que truena es lo que la app hace despues, NO se
       vuelve a preguntar (antes eso duplicaba el recordatorio). 2026-09-23 */
    var entregado = false;
    fetch(PROXY,{method:"POST",
      headers:{"content-type":"application/json","x-app-token":APP_TOKEN,"x-usuario":yo||"anonimo"},
      body:JSON.stringify({modelo:modelo||"rapido",messages:planos}),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j} }) })
     .then(function(res){
       if(tOut) clearTimeout(tOut);
       entregado = true;
       if(!res.ok){ cb(null,(res.j&&res.j.error)||"No se pudo preguntar."); return }
       cb((res.j.content&&res.j.content[0]&&res.j.content[0].text)||"",null);
     }).catch(function(e){
       if(tOut) clearTimeout(tOut);
       if(entregado){ try{console.error(e)}catch(_e){} toast("Falló después de la respuesta: "+String((e&&e.message)||e).slice(0,80)); return }
       if(intento<1){ setTimeout(function(){tira(intento+1)},800); return }
       cb(null, vencio ? "No contesto a tiempo." : "Sin conexion.");
     });
  }
  tira(0);
}

var COL="bitacora_tareas";     // tareas

/* ================= MOTOR DE REGLAS =================
   Todo lo que se definió con Salvador el 2026-09-02.
   NADA DE ESTO LO VE EL EMPLEADO: él solo ve HOY o VENCIDA.
   Las etiquetas las pone Claude al dar de alta la tarea.

   CAMPOS QUE LLEVA CADA TAREA
     f_original   la fecha con la que nació. NUNCA cambia. Contra ésta se mide.
     f_vigente    la fecha de hoy en día. Puede haberse movido.
     movidas      cuántas veces se movió la fecha.
     recuperable  true  -> entregar tarde todavía sirve (existe "tarde")
                  false -> pasada la hora ya no sirve (o verde, o NO EJECUTADA)
     criticidad   "diario" | "normal" | "lento"  -> tope de días trabado
     periodicidad null | "semanal" | "mensual"
     detenido     null | {quien,tel,que,desde,cadencia,toques:[{f,r}]}
     cierre       null | {tipo,motivo,f}
*/

var TOPE_TRABADO={diario:2,normal:5,lento:15};
var CADENCIA_TOQUE={diario:1,normal:1,lento:3};
var TOPE_UNICA_VENCIDA=30;   // días vencida sin nada -> no ejecutada
var MAX_MOVIDAS=2;           // la tercera no existe

/* Salvador 2026-09-22: antes usaba toISOString (UTC). En Mexico (UTC-6), de las
   6 pm en adelante eso devolvia el dia SIGUIENTE: "26 de septiembre" dictado a
   las 18:45 quedaba como 27. Ahora usa la fecha LOCAL, igual que hoy(). */
function iso(d){ d=new Date(d); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0") }
function dm(n){ var d=new Date(); d.setDate(d.getDate()+n); return iso(d) }
function dDif(a,b){ return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000) }

/* cuándo deja de servir una recuperable: lo dicta la periodicidad, no se pregunta */
function topeRecuperable(t){
  if(!t.f_original) return null;
  if(t.periodicidad==="semanal") return dmDe(t.f_original,7);
  if(t.periodicidad==="mensual") return dmDe(t.f_original,30);
  return dmDe(t.f_original,TOPE_UNICA_VENCIDA);
}
function dmDe(f,n){ var d=new Date(f+"T00:00:00"); d.setDate(d.getDate()+n); return iso(d) }

/* días que NO le cuentan a la persona: los que estuvo detenida CON su toque hecho */
function diasNoImputables(t){
  if(!t.detenido||!t.detenido.desde) return 0;
  var d=dDif(t.detenido.desde,hoy());
  return pausaValida(t)?d:0;
}

/* LA PAUSA NO ES GRATIS: si no hizo el toque, la pausa se rompe HACIA ATRÁS */
function pausaValida(t){
  var p=t.detenido; if(!p) return false;
  var cad=CADENCIA_TOQUE[t.criticidad||"normal"];
  var dias=dDif(p.desde,hoy());
  var esperados=Math.floor(dias/cad);
  return (p.toques||[]).length>=esperados;
}
function tocaToqueHoy(t){
  var p=t.detenido; if(!p) return false;
  var cad=CADENCIA_TOQUE[t.criticidad||"normal"];
  var ult=(p.toques||[]).length?p.toques[p.toques.length-1].f:p.desde;
  return dDif(ult,hoy())>=cad;
}
function diasDetenido(t){ return t.detenido?dDif(t.detenido.desde,hoy()):0 }

/* ---- EL ESTADO SE CALCULA, NO SE GUARDA A MANO ---- */
function estadoReal(t){
  if(t.cierre) return t.cierre.tipo==="hecha"?"cerrada":"no_ejecutada";
  if(t.detenido) return "detenida";
  if(!t.f_vigente) return t.estado||"abierta";
  var d=dDif(t.f_vigente,hoy());
  if(d<0) return "por_ejecutar";
  if(d===0) return "hoy";
  return "vencida";
}
function colorReal(t){
  var e=estadoReal(t);
  if(e==="cerrada"){
    var tarde=t.cierre&&t.f_original&&dDif(t.f_original,t.cierre.f)>0;
    return tarde?"naranja":"verde";
  }
  if(e==="no_ejecutada") return "rojo";
  if(e==="vencida") return "rojo";
  if(t.movidas>0) return "naranja";     // el rojo no se limpia moviendo la fecha
  return "verde";
}

/* ---- MOVER LA FECHA ---- */
function mueveFecha(t,nueva,razon){
  var e=estadoReal(t);
  if(t.periodicidad&&t.dia_fijo)
    return {ok:false,msg:"Esta es recurrente con día fijo. NO SE MUEVE. Si no se hizo hoy, el día se perdió."};
  if(e==="vencida")
    return {ok:false,msg:"Ya venció. Mover la fecha después de vencida no es mover, es un atraso. Cierra con motivo o entrega."};
  if(!razon||razon.length<8)
    return {ok:false,msg:"Para mover la fecha hace falta el motivo por escrito."};
  var n=(t.movidas||0)+1;
  if(n>MAX_MOVIDAS){
    cierraSinEjecutar(t,"Tercer cambio de fecha. "+razon);
    return {ok:false,msg:"Es el tercer cambio y el tercero no existe. La tarea se cierra SIN EJECUTAR y Salvador decide si renace."};
  }
  t.movidas=n; t.f_vigente=nueva;
  t.historial_fechas=t.historial_fechas||[];
  t.historial_fechas.push({de:t.f_vigente,a:nueva,f:hoy(),razon:razon,quien:yo});
  msg(t,"bi",n===1
    ? "Fecha movida al "+nueva+". Queda marcada: es el primer cambio. La fecha original ("+t.f_original+") es contra la que se mide."
    : "Segundo cambio. Éste necesita el visto bueno de Salvador y ya se le mandó. No hay tercero.");
  if(n===2){ t.estado="espera"; t.espera="salvador"; t.espera_desde=Date.now() }
  guarda(t);
  return {ok:true};
}

/* ---- ATORADO: declarar, tocar, escalar ---- */
function declaraAtorado(t,quien,tel,que,esDeFuera){
  if(!quien||!que) return {ok:false,msg:"Para declararte atorado hace falta A QUIÉN esperas y QUÉ. Sin nombre no se detiene nada."};
  t.detenido={quien:quien,tel:tel||"",que:que,desde:hoy(),fuera:!!esDeFuera,toques:[]};
  msg(t,"bi","Anotado: esperas a "+quien+". Mañana te recuerdo hablarle.");
  guarda(t); 
  //Notificación push instantánea al que destraba, si no soy yo mismo
  if (quien && quien !== yo) {
    disparaPushInstantaneo(
      quien,
      'Urgente: Requiere tu acción',
      'La tarea "' + t.nombre + '" requiere tu decisión/autorización'
    );
  }
  return {ok:true};
}
function toqueHecho(t,resultado){
  if(!t.detenido) return;
  t.detenido.toques.push({f:hoy(),r:resultado||"no contestó",quien:yo});
  msg(t,"bo","Toque a "+t.detenido.quien+": "+(resultado||"no contestó"));
  var n=t.detenido.toques.length, d=diasDetenido(t);
  var esc=escalaHoy(t);
  if(esc) msg(t,"bal",esc);
  guarda(t);
}
function destrabar(t){
  if(!t.detenido) return;
  msg(t,"bi","Se destrabó: "+t.detenido.quien+" ya contestó. Vuelve a correr el reloj.");
  t.dias_detenido_acum=(t.dias_detenido_acum||0)+diasNoImputables(t);
  t.trabo_historial=t.trabo_historial||[];
  t.trabo_historial.push({quien:t.detenido.quien,dias:diasDetenido(t),que:t.detenido.que});
  t.detenido=null; guarda(t);
}

/* LAS DOS ESCALERAS. La de dentro sube de nivel; la de fuera cambia de proveedor. */
function escalaHoy(t){
  if(!t.detenido) return null;
  var d=diasDetenido(t), tope=TOPE_TRABADO[t.criticidad||"normal"];
  if(t.detenido.fuera){
    if(d===1) return "Primer día de retraso de "+t.detenido.quien+". Vuélvele a hablar Y ve contactando a un segundo, para no depender de él.";
    if(d>=3) return "Van "+d+" días sin contestar. Trabaja con el segundo: no se pide permiso para cambiar de proveedor, se cambia y se avisa. Al primero no se le cancela: gana el que entregue.";
  }else{
    if(d>=3) return "Tres días seguidos sin respuesta de "+t.detenido.quien+". Esto sube solo al jefe del jefe, con qué decisión está parada y desde cuándo. No lo tienes que pedir tú.";
  }
  if(d>=tope) return "Llegó al tope de "+tope+" días trabado. La tarea deja de ser tuya y pasa al tablero de Salvador. Los días que siguen ya no te cuentan.";
  return null;
}

/* la tarea derivada del toque: no es una tarea guardada, se calcula */
function tareaDeToque(t){
  if(!t.detenido||!tocaToqueHoy(t)) return null;
  var d=diasDetenido(t);
  return {
    id:"toque:"+t.id, deriva:t.id, duenio:t.duenio,
    nombre:"Hablarle otra vez a "+t.detenido.quien,
    ultima:"Llevas "+d+" día"+(d===1?"":"s")+" esperando "+t.detenido.que,
    tel:t.detenido.tel, esToque:true
  };
}

/* REABRIR: la tarea vuelve a estar viva tal cual estaba, con su historial.
   Se anota quien y por que la reabrio. Si la fecha ya paso, se pide la nueva

function reabre(t, porque){

  t.pide_atoro=false; t.pide_tel=false; t.pide_fecha=false; t.fecha_pendiente=null;

  else msg(t,"bi","Reabierta."+(t.f_vigente?" Sigue para el "+fechaBonita(t.f_vigente)+".":""));
  sincronizaAvisos(t); guarda(t);

function cierraSinEjecutar(t,motivoK){
  var lista=MOTIVOS_NO_EJECUTADA.concat(MOTIVOS_JEFE);
  var m=(PERSONAS[yo]&&PERSONAS[yo].jefe&&t.duenio!==yo)
    ? MOTIVOS_JEFE.filter(function(x){return x.k===motivoK})[0]
    : lista.filter(function(x){return x.k===motivoK})[0];
  t.cierre={tipo:"no_ejecutada",motivo:motivoK,culpa:m?m.culpa:"suya",f:hoy()};

  if(m&&m.culpa==="trabo"&&!(t.detenido&&(t.detenido.toques||[]).length)&&!(t.trabo_historial||[]).length){
    t.cierre.culpa="suya";
    t.cierre.nota="Dijo que lo trabaron pero no hay ni un toque registrado.";
  }
  t.estado="no_ejecutada"; t.pide_atoro=false; t.pide_tel=false; t.pide_fecha=false;

/* la coleccion de fichas. Aqui NO va ningun NIP: las claves no entran al
   sistema, viven solo en el telefono de cada quien. */
var COLP="bitacora_personas";
/* ============ EL ACCESO (build 72, antes "invitaciones") ==================
   SUPERADO 2026-09-16: las ligas ?inv= de un solo uso (2026-09-03) se
   retiraron junto con el NIP. Ya no hay nada que caduque ni que verificar por
   WhatsApp: la puerta la abre el CORREO dado de alta y Google comprueba que
   la persona es duena de ese correo. Lo que se manda por WhatsApp es la pura
   liga de la app, que no abre nada por si sola. Dar de alta pueden Salvador
   y Josue (PUEDE_ALTA). */

/* la clave interna con la que va a vivir en el sistema: del nombre, sin acentos */
function claveDe(nombre){
  var b=String(nombre||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
        .replace(/[^a-z0-9]+/g,"").slice(0,20);
  if(!b) b="persona";
  var c=b, n=2;
  while(PERSONAS[c]) { c=b+n; n++ }
  return c;
}
/* Mexico son 10 digitos; wa.me los quiere con lada de pais y sin signos */
function telWa(tel){
  var d=String(tel||"").replace(/\D/g,"");
  if(d.length===10) d="52"+d;
  if(d.length===12 && d.indexOf("521")===0) d="52"+d.slice(3);   // el 1 viejo
  return d;
}
function creaAcceso(nombre, correo, cb){
  var mail=String(correo||"").toLowerCase().trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){ cb(null,"Ese correo no se ve completo"); return }
  if(!db){ cb(null,"Sin conexión: no se pudo dar el acceso"); return }
  var acc={clave:claveDe(nombre), nombre:String(nombre).trim(), jefe:false,
           por:yo, alta:Date.now()};
  db.collection(COLACC).doc(mail).set(acc)
    .then(function(){ cb(acc,null) })
    .catch(function(){ cb(null,"No se pudo guardar el acceso") });
}
function textoAcceso(nombre){
  return "Hola "+nombre+", soy "+((PERSONAS[yo]&&PERSONAS[yo].nombre)||"Salvador")+". "+
    "Te di de alta en la bitácora de la oficina: ahí te llegan tus pendientes y me "+
    "contestas ahí mismo, sin correos.\n\n"+location.origin+location.pathname+"\n\n"+
    "Ábrela y pica “Entrar con Google” con tu cuenta.";
}
function APP_URL(){ return location.origin+location.pathname }
/* LIGA DE UN SOLO USO (Salvador 2026-09-16). Cada liga trae un token unico.
   El primero que entra con Google usando esa liga la QUEMA: queda amarrada a
   su correo y ya no sirve para nadie mas. Sin liga valida, un correo NUEVO no
   entra (asi la pura direccion publica no abre la puerta). El que ya entro
   regresa con su solo Google, sin liga. */
function altaToken(){
  if(window.__alta) return window.__alta;
  try{ return localStorage.getItem("bit_alta")||null }catch(e){ return null }
}
function nuevaLiga(cb){
  if(!db){ cb(null,"Sin conexión"); return }
  var tk=uid()+uid();
  db.collection(COLI).doc(tk).set({token:tk, por:yo, creada:Date.now(), usada:0})
    .then(function(){ cb(location.origin+location.pathname+"?alta="+tk, null) })
    .catch(function(){ cb(null,"No se pudo generar la liga") });
}
/* ¿la liga que trae este telefono es valida y esta sin usar? Si si, la QUEMA
   amarrandola a este correo y contesta true. */
function consumeLiga(mail,cb){
  var tk=altaToken();
  if(!tk){ cb(false); return }
  var fb=firebase.firestore();
  fb.collection(COLI).doc(tk).get().then(function(d){
    if(!d.exists){ cb(false); return }
    var inv=d.data()||{};
    if(inv.usada){ cb(false); return }
    fb.collection(COLI).doc(tk).set({usada:Date.now(), correo:mail},{merge:true})
      .then(function(){ try{localStorage.removeItem("bit_alta")}catch(e){} window.__alta=null; cb(true) })
      .catch(function(){ cb(false) });
  }).catch(function(){ cb(false) });
}
function abreWhatsApp(tel,texto){
  window.open("https://wa.me/"+telWa(tel)+"?text="+encodeURIComponent(texto),"_blank");
}

/* ================= ENCARGOS Y SUPLENCIA =================
   REGLA MADRE: una tarea, un dueño, una fecha, un semáforo.
   Lo que se comparte es la EJECUCIÓN, nunca la tarea.
   NO SE ACEPTA un encargo: cae en la lista y ya. El primero que responda cierra.
   DELEGAR NO PARA EL RELOJ. Detenido sí; delegado no.  */

var COLE="bitacora_encargos";
var COLS="bitacora_suplencias";
/* ============ LA FICHA DE CADA PERSONA ============
   PEDIDO POR SALVADOR, 2026-09-03.
   EL PROBLEMA: las iniciales de la derecha estaban escritas a mano en el codigo
   (S, SM, C...). Con dos Samueles o dos Carlos deja de servir, y nadie tiene
   como corregirlo sin tocar el archivo.
   LA SOLUCION: cada quien llena su ficha la PRIMERA VEZ que abre la app —
   nombre, apellido, correo de trabajo y correo personal — y de ahi salen las
   iniciales solas: primera del nombre + primera del apellido.
   Las fichas viven en Firestore, no en el codigo, y se pueden corregir en
   "Tu cuenta". NO SE PIDE NADA MAS: ni telefono ni puesto. Lo que no se usa,
   no se pregunta. Y NUNCA una clave: eso no entra al sistema. */

function iniciales(nombre, apellido){
  var n=String(nombre||"").trim(), a=String(apellido||"").trim();
  if(n && a) return (n.charAt(0)+a.charAt(0)).toUpperCase();
  if(n) return n.charAt(0).toUpperCase();
  return "?";
}
function fichaCompleta(k){
  var p=PERSONAS[k];
  return !!(p && p.nombre && p.apellido && p.mail_trabajo);
}
function guardaFicha(k, d){
  var p=PERSONAS[k]; if(!p) return;
  p.nombre=String(d.nombre||"").trim()||p.nombre;
  p.apellido=String(d.apellido||"").trim();
  p.mail_trabajo=String(d.mail_trabajo||"").trim();
  p.mail_personal=String(d.mail_personal||"").trim();
  p.ini=iniciales(p.nombre, p.apellido);
  if(db) db.collection(COLP).doc(k).set({
    nombre:p.nombre, apellido:p.apellido,
    mail_trabajo:p.mail_trabajo, mail_personal:p.mail_personal,
    ini:p.ini, tocada:Date.now()
  },{merge:true}).catch(function(){ toast("No se pudo guardar tu ficha") });
}
var encargos=[], suplencias={};

/* limite por defecto: si cuelga de una tarea, hereda su fecha; si es suelto, hoy */
function creaEncargo(para, texto, tareaId, limite){
  if(!para||!texto) return null;
  var t=tareaId?tareas.filter(function(x){return x.id===tareaId})[0]:null;
  var e={
    id:"e"+uid(), de:yo, para:para, texto:String(texto).trim(),
    tareaId:tareaId||null, tarea:t?t.nombre:"",
    creado:Date.now(), limite:limite||(t&&t.f_vigente)||hoy(),
    visto:0, respuesta:"", respondido:0, cerrado:0
  };
  encargos.push(e);
  guardaEncargo(e);
  if(t){

/* CUATRO ESTADOS, y "nunca contestó" y "ni lo abrió" van aparte a propósito:
   uno estaba ocupado, el otro lo vio y lo ignoró. No es la misma falta. */
function estadoEncargo(e){
  if(e.cerrado){
    return dDif(e.limite, iso(e.respondido))>0 ? "tarde" : "a_tiempo";
  }
  if(dDif(e.limite,hoy())>0) return e.visto ? "sin_contestar" : "ni_abierto";
  return "pendiente";
}

  var c={a_tiempo:0,tarde:0,sin_contestar:0,ni_abierto:0,pendiente:0};
  encargos.forEach(function(e){ if(e.para===persona) c[estadoEncargo(e)]++ });
  return c;
}

    var st=estadoEncargo(e);
    if(st==="sin_contestar"||st==="ni_abierto") n++;
  });
  return n;
}

function estaFuera(persona){

}
/* a quién le toca autorizar ahorita. El default si nadie nombró suplente:
   sube al jefe inmediato. Ésa es la única regla de puestos que hace falta. */
function quienAutoriza(persona, monto){
  var jefe=null;
  Object.keys(PERSONAS).forEach(function(k){ if(PERSONAS[k].jefe && !jefe) jefe=k });
  var destino=jefe;
  if(estaFuera(destino)){
    var s=suplencias[destino];
    if(monto!=null && s.tope>0 && monto>s.tope){
      return {quien:destino, fuera:true, sobreTope:true,
        nota:"Son "+monto+" y "+PERSONAS[s.suplente].nombre+" puede autorizar hasta "+s.tope+". "+
             (s.arriba==="marca"?"Márcale a "+PERSONAS[destino].nombre+".":"Se espera a que "+PERSONAS[destino].nombre+" regrese el "+s.hasta+".")};
    }

      nota:PERSONAS[destino].nombre+" está fuera. Lo ve "+PERSONAS[s.suplente].nombre+"."};
  }

}

/* ---- TRANSFERENCIA: PERMANENTE Y NADA MÁS ----
   La temporal se descartó el 2026-09-02: es una puerta trasera —se transfiere todo
   antes de cada viaje y se regresa limpio— y la responsabilidad no se quita por ir
   en un avión. Para el viaje ya existe la salida honesta: mover la fecha ANTES de
   que venza, con la razón escrita. */
function transfiere(t, nuevo, razon){
  if(!nuevo||!PERSONAS[nuevo]) return {ok:false,msg:"Falta a quién."};
  if(nuevo===t.duenio) return {ok:false,msg:"Ya es suya."};
  t.duenio_anterior=t.duenio;
  t.duenio=nuevo;
  t.transferida={de:t.duenio_anterior, a:nuevo, f:hoy(), razon:razon||""};
  msg(t,"bal","Esta tarea pasó de "+PERSONAS[t.duenio_anterior].nombre+" a "+PERSONAS[nuevo].nombre+
    ", en definitiva"+(razon?": "+razon:"")+". La fecha original no se movió.");
  guarda(t);
  return {ok:true};
}

/* ===== LA CAJA DE ESCRIBIR (contenteditable) SE COMPORTA COMO UN INPUT =====
   Salvador, 2026-09-04. Se cambiaron el <input> de la barra y los <textarea>
   del hilo por divs editables, para que el teclado de iPhone traiga el
   AUTOCORRECTOR y para que se vaya la franja de las flechitas < > (esa la
   pone Safari sola encima del teclado cuando lo enfocado es un control de
   formulario; no se quita con CSS ni con JS, solo dejando de usar uno).

   Para no tener que tocar las veinte partes del codigo que ya decian
   caja.value, aqui se le cuelga un .value de mentiras que lee y escribe el
   texto de adentro. Asi el dictado, el Enter, el borrar al mandar y el
   crecer de alto siguen funcionando exactamente igual que antes. */
function cajaEditable(el){
  if(!el || el.__caja) return el;
  el.__caja=true;
  function vacia(){ el.classList.toggle("vacia", !el.textContent.trim()) }
  Object.defineProperty(el,"value",{
    configurable:true,
    get:function(){ return (el.innerText||"").replace(/\u00a0/g," ") },
    set:function(v){ el.textContent=(v==null?"":String(v)); vacia() }
  });
  el.addEventListener("input", vacia);
  /* LO PEGADO ENTRA COMO TEXTO PELON. Si no, se cuela el formato (negritas,
     colores, ligas) de donde lo hayan copiado y la barra se descompone. */
  el.addEventListener("paste", function(ev){
    ev.preventDefault();
    var t=(((ev.clipboardData||window.clipboardData).getData("text/plain"))||"")
          .replace(/\s+/g," ");
    try{ document.execCommand("insertText", false, t) }
    catch(e){ el.textContent=el.textContent+t; vacia() }
  });
  vacia();
  return el;
}

  var hay=!!String(texto||"").trim() && !window.__oyendo;

/* HOY, EN LA HORA DE AQUI. Antes usaba toISOString(), que es UTC: en Torreon
   (GMT-6) despues de las 6 de la tarde la app ya creia que era el dia siguiente
   y todo lo dictado en la noche se iba con la fecha de mañana. 2026-09-04. */
function hoy(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+
         String(d.getDate()).padStart(2,"0");
}
var DIAS_SEM=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
/* El calendario que se le pasa a Claude. Antes solo iba "hoy: 2026-09-04" y el
   tenia que sacar solo que dia de la semana era: fallaba casi siempre y "el
   lunes" caia en martes. Ahora se le da la tabla hecha. */
function calendarioProximo(n){
  var d=new Date(), out=[];
  for(var i=0;i<n;i++){
    var x=new Date(d.getFullYear(), d.getMonth(), d.getDate()+i);
    var iso=x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+
            String(x.getDate()).padStart(2,"0");
    out.push(iso+" "+DIAS_SEM[x.getDay()]+(i===0?" (HOY)":(i===1?" (MAÑANA)":"")));
  }
  return out;
}
function hhmm(d){d=d||new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}

function resuelveAcceso(user){
  pintaEspera("Un momento…");
  var mail=String(user.email||"").toLowerCase().trim();
  if(!mail){ pintaLogin("Tu cuenta de Google no trajo correo."); return }
  var fb=firebase.firestore();
  /* los de siembra nunca se pueden bloquear (si no, un error deja fuera al jefe) */
  var revisa = CORREOS_SEMILLA[mail]
    ? Promise.resolve(false)
    : fb.collection(COLBLOQ).doc(mail).get().then(function(d){ return d.exists });
  revisa.then(function(bloqueado){
    if(bloqueado){ pintaBloqueado(mail); return; }
    buscaAcceso(mail, user.displayName||"", function(acc){
      /* un correo NUEVO solo entra con una liga valida y sin usar, que se quema
         al entrar. El que ya tiene ficha (o es de siembra) no necesita liga. */
      if(acc.nuevo){
        consumeLiga(mail, function(ok){
          if(!ok){ pintaSinLiga(mail); return }
          entraCon(acc, mail);
        });
      } else {
        entraCon(acc, mail);
      }
    }, function(){
      pintaLogin("No se pudo entrar. Revisa la señal e intenta otra vez.");
    });
  }).catch(function(){
    pintaLogin("No se pudo entrar. Revisa la señal e intenta otra vez.");
  });
}

   respuesta cae en el hilo de la tarea (wa_respuesta). Devuelve promesa. */
function pideWhatsApp(cuerpo){
  if(typeof APP_TOKEN==="undefined" || String(APP_TOKEN).indexOf("__")===0)
    return Promise.reject(new Error("sin token"));
  return fetch(PUSH+"?action=wa_pedido",{method:"POST", keepalive:true,
      headers:{"content-type":"application/json","x-app-token":APP_TOKEN},
      body:JSON.stringify(cuerpo)})

      if(!r.ok || (j&&j.error)) throw new Error((j&&j.error)||("HTTP "+r.status)); return j; }); });

function arranca(){

       build 136: fbListo() tambien prende la cache local */

      encargos=[]; snap.forEach(function(d){var o=d.data();o.id=d.id;encargos.push(o)});

    db.collection(COLS).onSnapshot(function(snap){
      suplencias={}; snap.forEach(function(d){ suplencias[d.id]=d.data() });
      if(listo) render();
    },function(){});
    /* las fichas se mezclan ENCIMA del catalogo del codigo: asi todo lo que ya
       lee PERSONAS[k].nombre y .ini sigue funcionando sin tocar una sola linea. */
    db.collection(COLP).onSnapshot(function(snap){
      snap.forEach(function(d){
        var o=d.data()||{}, p=PERSONAS[d.id];
        if(!p){ PERSONAS[d.id]={jefe:false}; p=PERSONAS[d.id] }
        if(o.nombre) p.nombre=o.nombre;
        p.apellido=o.apellido||"";

        p.mail_personal=o.mail_personal||"";
        if(o.nombre&&o.apellido) p.ini=iniciales(o.nombre,o.apellido);
      });
      fichasLeidas=true;
      if(listo) render();
    },function(){
      /* si la coleccion esta bloqueada NO se abre la puerta de la ficha:
         seria encerrar a la gente en un formulario que no puede guardar. */
      fichasLeidas=false;
      console.warn("No se pudieron leer las fichas de personas");
    });
    db.collection(COL).onSnapshot(function(snap){
      dbFail=false;   /* enganchó de verdad: no hay falla */
      tareas=[]; snap.forEach(function(d){var o=d.data();o.id=d.id;tareas.push(o)});
      /* LOS EJEMPLOS NO SE SIEMBRAN EN LA BASE — corregido 2026-09-04, el día
         que Josué abrió las reglas. Antes, con la base vacía, se subían las ~15

         pintan SOLO en pantalla y jamás se suben (ver el candado en guarda()).
         En cuanto haya una tarea de verdad, los ejemplos desaparecen solos. */
      var _hayReal=tareas.length>0;
      /* build 136: si el snapshot vacio viene de la cache local (aun no llega
         el servidor) NO se siembran ejemplos: en un segundo llega lo real. */
      var _deCache=!!(snap.metadata && snap.metadata.fromCache);
      if(!tareas.length && !_deCache) tareas=SEMILLA.slice();
      listo=true; render();
      /* ESPEJO INICIAL: los avisos que ya existían también se registran en
         bitacora_avisos, una sola vez por tarea (Salvador 2026-09-18). Nunca con
         los ejemplos: solo si había datos reales en la base. */
      if(db && _hayReal && !window.__espejoInicial){ window.__espejoInicial=true;
        setTimeout(function(){ tareas.forEach(function(x){
          if(!x.cierre && (x.es_recordatorio || (x.avisos&&x.avisos.length)) && !x.avisos_espejo){
            try{ sincronizaAvisos(x); }catch(e){}
          }
        }); }, 3000);
      }
      /* si venías de una notificación, abre ese recordatorio directo, con el
         micrófono listo para dictar qué hacer con él (una sola vez) */
      if(window.__irARec && !window.__recAbierto){
        window.__recAbierto=true;
        var _rr=tareas.filter(function(x){return x.id===window.__irARec})[0];
        /* también puede venir el id de un aviso insertado (tarea|ts) */
        if(!_rr && /\|/.test(window.__irARec)){
          var _pp=String(window.__irARec).split("|");
          _rr=tareas.filter(function(x){return x.id===_pp[0]})[0];
          if(_rr) window.__avSonando={taskId:_rr.id, id:_pp[1]};
        } else if(_rr){ window.__avSonando={taskId:_rr.id, id:"self"}; }
        window.__irARec=null;
        /* Salvador 2026-09-24: la hoja de recordatorios solo se abre si hay
           uno sonando; si la tarea ya esta cerrada o sin alarmas, solo el hilo. */
        if(_rr){ abierta=_rr.id; vista="hilo"; window.__avSheet=avisoSonando(_rr)?_rr.id:null; if(!avisoSonando(_rr)) window.__avSonando=null; render(); }
      }
      /* EL CORRETEO ARRANCA SOLO. Se espera 6 segundos para que terminen de
         llegar encargos, fichas y suplencias, y se le mete un empujoncito al
         azar para que si dos personas abren la app al mismo tiempo no lleguen
         las dos al mismo segundo. Después, cada media hora mientras siga
         abierta. */
      if(!window.__correteoArmado){
        window.__correteoArmado=true;
        setTimeout(function(){ try{ correteo() }catch(e){ console.error(e) } },
                   6000+Math.floor(Math.random()*4000));
        setInterval(function(){ try{ correteo() }catch(e){ console.error(e) } },
                    30*60000);
      }
    },function(err){
      /* HONESTIDAD DE FALLAS — corregido 2026-09-04. Antes se callaba este error
         creyendo que era un parpadeo de arranque. NO lo era: si Firestore niega
         permisos (permission-denied), la base esta CERRADA y NADA se guarda —
         ni lo propio. Callarlo va contra la regla de Salvador: las fallas
         tecnicas se dicen. Ahora, si es permiso denegado, se prende un aviso
         PERSISTENTE; si es otro error transitorio, se deja pasar. */
      console.error(err);
      if(err && err.code==="permission-denied"){ dbFail=true; }
      if(!listo && !tareas.length){ tareas=SEMILLA.slice(); render(); }
      else render();
    });
  }catch(e){
    console.error(e); dbFail=true; tareas=SEMILLA.slice(); render();
  }
}

function guarda(t){
  t.tocada=Date.now();
  /* CANDADO: un ejemplo se ve, pero NUNCA sube a la base que comparte el
     equipo. Y se dice, para que nadie crea que quedó guardado. */
  if(esEjemplo(t)){ toast("Es una tarea de ejemplo: no se guarda"); render(); return }
  if(!db){render();return}
  /* Red: se limpian los undefined antes de subir, y si Firestore truena en el
     acto se DICE (antes el error rompia todo lo que venia despues). 2026-09-23 */
  limpiaUndef(t);
  /* build 136: sin red queda en la cola local y sube solo; se dice una vez/min */
  if(navigator.onLine===false){
    var _ahoraSR=Date.now();
    if(!window.__sinRedAviso || _ahoraSR-window.__sinRedAviso>60000){
      window.__sinRedAviso=_ahoraSR; toast("Sin red · queda guardado aqui y sube en cuanto haya conexion"); }
  }
  var _p;
  try{ _p=db.collection(COL).doc(t.id).set(t); }
  catch(e){ try{console.error(e)}catch(_e){} toast("No se pudo guardar: "+String((e&&e.message)||e).slice(0,80)); return; }
  _p.catch(function(e){
    console.error(e);
    if(e && e.code==="permission-denied"){ dbFail=true; render(); }
    toast("No se pudo guardar");
  });
}
/* quita (en su lugar) los campos undefined de objetos y arreglos anidados */
function limpiaUndef(o){
  if(Array.isArray(o)){ for(var i=0;i<o.length;i++){ if(o[i]===undefined) o[i]=null; else limpiaUndef(o[i]); } return o; }
  if(o && typeof o==="object" && Object.getPrototypeOf(o)===Object.prototype){
    Object.keys(o).forEach(function(k){ if(o[k]===undefined) delete o[k]; else limpiaUndef(o[k]); });
  }
  return o;
}
